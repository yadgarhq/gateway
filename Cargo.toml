[package]
name = "yadgar-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The bilingual edge: MCP over HTTP outward, gRPC inward (D16)."

[dependencies]
# OUTWARD: HTTP. This is the only service in the system that speaks anything but
# gRPC (D16), and the reason it exists as its own process rather than a mode of
# another one.
axum = "0.8"
tower-http = { version = "0.7", features = ["limit"] }

# INWARD: gRPC to the module services. No sqlx and no yadgar-store here, for the
# same reason a logic service has none (D4): the gateway reaches data only over a
# module's API, never by opening a connection of its own.
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "transport",
  "channel",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# The shared instrumentation seam (D67). Pinned by revision like every other
# in-org crate — a branch is a moving target.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", rev = "1273e45e641c6af5187af1203dfb153d4369b5bc", features = [
  "grpc",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
http = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
