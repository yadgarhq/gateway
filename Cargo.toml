[package]
name = "yadgar-gateway"
# A PLACEHOLDER, and deliberately one nobody could mistake for a release. Nothing
# has ever written a version into this file: a module's version in this
# organisation is its release tag (D65), derived at merge from the `## Changelog`
# bullets. This said `0.1.0` while the tags ran to `v0.8.1`, and `server/discover`
# served that number to every MCP client.
#
# Bumping it per pull request was considered and rejected — it puts a conflict on
# one line in every concurrent branch, and a human asserting a number does not make
# it true. The real number is stamped by `build.rs` from `YADGAR_GATEWAY_VERSION`
# and read as `crate::VERSION`; see both for the rest of the reasoning.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "The bilingual edge: MCP over HTTP outward, gRPC inward (D16)."

[dependencies]
# OUTWARD: HTTP. This is the only service in the system that speaks anything but
# gRPC (D16), and the reason it exists as its own process rather than a mode of
# another one.
axum = "0.8"
tower-http = { version = "0.7", features = ["limit"] }

# INWARD: gRPC to the module services. No sqlx and no yadgar-store here, for the
# same reason a logic service has none (D4): the gateway reaches no module's
# DATABASE except over that module's API.
#
# Valkey below is not a counter-example, and the distinction is the one D21
# draws: the shared cache is INFRASTRUCTURE, not a service, and it fronts
# nobody's database. D77 already accepted the same cost in the same words —
# "the gateway now holds state between two calls, and it did not before".
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "transport",
  "channel",
  # `tls-ring`, NOT `tls-aws-lc`, and NAMED HERE rather than inherited. Feature
  # unification would hand this crate `ClientTlsConfig` anyway, because
  # yadgar-dial asks for it — but `upstream::connect_iam` builds one DIRECTLY,
  # and a type that compiles only because a dependency happens to ask for a
  # feature is one a dependency can also stop asking for.
  #
  # ring rather than aws-lc-rs for the reason dial gives: aws-lc-rs needs cmake
  # and a C toolchain, and this builds for x86_64-unknown-linux-musl (D63).
  #
  # NEITHER `tls-native-roots` NOR `tls-webpki-roots`, deliberately. Those add
  # the platform trust store, and a private CA that failed to load would then
  # be silently replaced by public roots — the exact downgrade this change
  # exists to remove.
  "tls-ring",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# The SAME PEM parser tonic itself uses on a CA bundle, so "we found N
# certificates" is exactly what tonic will find. Present in the tree already by
# way of tokio-rustls; naming it directly costs nothing and buys the non-empty
# assertion in `upstream::UpstreamTls::client_tls_config`, without which a
# bundle that decodes to no certificate produces a trust store that trusts
# nobody and fails much later, at the handshake.
rustls-pki-types = { version = "1", features = ["std"] }
# How this process starts, stops and restarts: ADR-0523's exit-on-change rotation
# watcher, the SIGTERM drain, and the budget that bounds it. This repository held
# the THIRD copy of the watcher and one of five copies of `shutdown`. The X.509
# parser that read a leaf's expiry is ITS dependency now, so it is gone from
# here; `rustls-pki-types` stays because `upstream` reads a bundle of its own.
#
# Pinned by a published tag per ADR-0526, like every other in-org crate.
yadgar-lifecycle = { git = "https://github.com/yadgarhq/lifecycle.git", tag = "v0.1.2" }
# For `RootCertStore::add_parsable_certificates` ALONE, so the CA bundle can be
# asserted non-empty the way tonic will actually build it. Counting PEM sections
# is NOT counting trust anchors: tonic feeds the DERs into
# `add_parsable_certificates` and DISCARDS the `(accepted, rejected)` return with
# no check after it
# (`tonic-0.14.6/src/transport/channel/service/tls.rs:104`), so a bundle whose
# sections decode as PEM and parse as no trust anchor yields the empty root store
# with no error — the exact thing the section count exists to prevent.
#
# `default-features = false` with `std` alone: NO crypto provider is pulled in
# here. tonic already chooses `ring` through `tls-ring`, and a second provider in
# the tree is how a build acquires an ambiguous default. CHECKED rather than
# assumed: `cargo tree -e normal -i aws-lc-rs` still matches no package.
#
# Already in the lock file by way of tokio-rustls, so this adds nothing to the
# build — the same reasoning `rustls-pki-types` above is here for.
rustls = { version = "0.23", default-features = false, features = ["std"] }

# Client-side balancing over task's headless Service (D23). Shared rather than
# copied from task, per the invariant that anything every service needs is
# implemented once.
#
# The RELEASE TAG, like every other in-org pin in this file. A published tag
# never moves in this organisation — a correction is a new tag, never a moved
# one — so `v0.1.0` names one commit for as long as it exists, and Cargo.lock
# records the full 40-character revision it resolved to. The pin stays exact and
# auditable, and the git dependency finally states a version it had no way to
# state before.
yadgar-dial = { git = "https://github.com/yadgarhq/dial.git", tag = "v0.2.0" }

# The shared instrumentation seam (D67). Pinned by release tag like every other
# in-org crate — a branch is a moving target, a published tag is not.
yadgar-telemetry = { git = "https://github.com/yadgarhq/telemetry.git", tag = "v0.1.0", features = [
  "grpc",
] }

# The shared cache (D21), holding D74's token buckets. `script` is not optional:
# the read-compute-write MUST be one atomic operation or the limit is silently
# multiplied by the replica count. Default features are off — acl, streams,
# geospatial and num-bigint are surface this service never touches.
redis = { version = "1.6", default-features = false, features = [
  "script",
  "tokio-comp",
  "connection-manager",
] }

# The metrics facade, DIRECTLY rather than through yadgar-telemetry. The three
# D67 signals go through that seam and still do; the rate limiter's degradation
# counter is a fourth signal belonging to this service alone, and putting it in
# the shared crate would make every service carry a metric only one can emit.
# Already in this tree via yadgar-telemetry, so it adds nothing to the build.
metrics = "0.24"

# ONE HASH, for one purpose: the user id in D74's bucket key. The id is
# caller-supplied under `Attestation::TrustedHeaders` and the key lands in the
# cache D21 shares with four other subsystems, so it must be bounded before it
# gets there. Cryptographic rather than a fast non-cryptographic hash because a
# user who can choose their own name could otherwise search offline for one that
# collides with somebody else's bucket and throttle them. Default features off:
# no `std` detection of CPU features is needed for a 32-byte digest per request.
sha2 = "0.10"

# THE BROKER (D22), for consuming D72's cache invalidation. The SAME version
# `iam` publishes with: the two speak the NATS wire protocol through a server and
# share no crate, but a version skew is a difference nobody would think to look
# for.
#
# Default features, as `iam` has them, and NOT a counter-example to the
# `tls-ring` reasoning above. That reasoning is about aws-lc-rs, which needs cmake
# and would break the musl build (D63); `async-nats` reaches rustls through ring,
# which this tree already carries. CHECKED rather than assumed:
# `cargo tree -e normal -i aws-lc-rs` matches no package, and every rustls path
# under this crate resolves to `ring v0.17.14`. So this adds NO native dependency
# the build image did not already have to satisfy.
async-nats = "0.50"
# `StreamExt::merge`, so both invalidation subscriptions are drained by one loop
# rather than by two tasks that would each have to be supervised. Already in this
# tree by way of tonic, so it adds nothing to the build.
tokio-stream = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
http = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# `test-util` is what `#[tokio::test(start_paused = true)]` and
# `tokio::time::advance` need, and it is the only way to prove a cached credential
# EXPIRES without a test that sleeps for the TTL. A DEV-dependency rather than a
# feature on the real one, for the same reason `router` below is: the v2 resolver
# keeps dev-dependency features out of a normal build, so the shipped binary
# carries no test clock. Both entries resolve to one crate version.
#
# `net`, `io-util` and `sync` for the fake broker in
# `tests/credential_invalidation.rs`, which binds its own listener and reads the
# `SUB` lines off the socket to assert what actually went on the wire. Named here
# rather than relied on: `async-nats` enables all three, so feature unification
# would supply them today, and a dependency that moved would take these tests
# with it.
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "test-util",
  "net",
  "io-util",
  "sync",
] }
# `Server::add_service`, so a TEST can answer as `iam`. Without one the only
# reachable outcomes on the attested path are "no credential" and "the transport
# failed" — and the answer `iam` gives as `Ok` with an empty `user_id`, for a token
# that is unknown or revoked, is unreachable. Reading that as a success is an
# authentication bypass, so it has to be testable.
#
# **`router` IS THE ONLY FEATURE THIS ADDS, and `server` is not one of them.**
# tonic defines `transport = ["server", "channel"]`, so the dependency above
# already pulls the server machinery in; what it lacks is the routing layer
# `add_service` lives on, which carries axum. Checked with
# `cargo tree -e features,no-dev -i tonic` rather than assumed — the first version
# of this comment claimed `server` was absent and was wrong.
#
# A DEV-DEPENDENCY rather than a feature on the real one: the v2 resolver keeps
# dev-dependency features out of a normal build, so `cargo build` links no router.
# Both entries resolve to one crate version.
tonic = { version = "0.14", default-features = false, features = ["router"] }
# `ServiceExt::oneshot`, to drive `router()` in-process. axum is built on tower
# and already carries it transitively; naming it here is what makes the trait
# importable from a test, and it adds nothing to the dependency tree.
tower = { version = "0.5", features = ["util"] }
# A recorder to assert AGAINST, for the D67 coverage test. `metrics` is the
# facade yadgar-telemetry already publishes through and `metrics-util` ships the
# debugging recorder that can be snapshotted in-process; both are already in this
# tree via metrics-exporter-prometheus, so neither adds anything to the build.
metrics = "0.24"
metrics-util = { version = "0.20", default-features = false, features = [
  "debugging",
] }
# A real TLS server for `connect_iam` to handshake against. A test that only
# shows "TLS was configured" passes against the version of this change that
# connects in cleartext — tonic decides TLS from the URI SCHEME, not from
# whether a configuration is attached — so nothing about the transport can be
# proved by inspection.
#
# CERTIFICATES ARE MINTED PER RUN rather than checked in: a fixture key in the
# repository is a secret in the repository, and it expires on a date nobody is
# watching. `ring` for the same reason the real dependency uses it.
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }
# `TcpListenerStream`, so the test server's listener is BOUND before it is
# served — picking a port and reopening it leaves a window in which something
# else can take it. Already in the lock file by way of tonic.
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
