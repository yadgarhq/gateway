// The task module's PUBLIC API — what a gateway calls (D4).
//
// WHY A SEPARATE PACKAGE, and it is worth knowing before copying this shape:
// the logic service and the -db twin are two contracts with different audiences
// and different rates of change, and `buf lint` enforces that by refusing to let
// two RPCs share a request or response type. So they cannot share messages even
// where the fields happen to match today — which is the point, since the moment
// one needs a field the other must not have, a shared message would force it on
// both.
//
// The `-db` contract took `yadgar.task.v1` first and is already tagged and
// implemented, so moving it here would be a breaking change the D16 gate
// correctly refuses. FOR EVERY MODULE AFTER THIS ONE: put the LOGIC service in
// `yadgar/<module>/v1` and the storage boundary in `yadgar/<module>db/v1`. This
// package exists because that order was discovered rather than planned.
syntax = "proto3";

package yadgar.taskapi.v1;

import "google/protobuf/field_mask.proto";
import "yadgar/common/v1/common.proto";
import "yadgar/task/v1/task.proto";

message CreateTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;

  // The caller supplies content, never identity. `id`, `number`, `version` and
  // every Meta field are assigned by the module — a client that could set them
  // could collide with, or overwrite, a record it does not own (D42).
  //
  // At most 128 Unicode scalar values. A longer title is refused with
  // INVALID_ARGUMENT once enforcement ships; the unit, its reasons and when it
  // is enforced are on yadgar.task.v1.Task.title.
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  repeated string links = 6;
}
message CreateTaskResponse {
  yadgar.common.v1.Meta meta = 1;
  uint32 number = 2;
}

message ReadTaskRequest {
  yadgar.common.v1.Scope scope = 1;
  oneof key {
    string id = 2;
    uint32 number = 3;
  }
}
message ReadTaskResponse {
  yadgar.task.v1.Task task = 1;
}

message FindTasksRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated yadgar.task.v1.TaskStatus statuses = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message FindTasksResponse {
  repeated yadgar.task.v1.Task tasks = 1;
  string next_page_token = 2;
}

message EditTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;

  // THE TASK IS NAMED BY EXACTLY ONE OF `id` OR `number`. Both, or neither, is
  // refused with INVALID_ARGUMENT.
  //
  // `number` IS 0 WHEN ABSENT, and 0 is never a task: the per-project counter
  // hands out 1 first. So the zero value cannot be mistaken for a task number,
  // and no `optional` is needed to tell the two apart.
  //
  // THE TWO KEYS REACH DIFFERENT SETS, and that is deliberate. `id` is a global
  // URN and reaches any task the caller's scope reaches, its project's subtree
  // included. `number` is unique only within one project, so it resolves in the
  // caller's EXACT project and never in a project above, beside or below it — a
  // number that exists only in another project is NOT_FOUND, exactly as an
  // unknown id is.
  //
  // WHY NOT A `oneof`, as ReadTaskRequest has. Moving the existing `id` into a
  // oneof is a breaking change under `buf breaking`'s FILE rules (D15), so the
  // rule is stated here and enforced by the logic service instead.
  string id = 3;
  uint64 expect_version = 4;
  // At most 128 Unicode scalar values when the mask writes `title`. A longer
  // title is refused with INVALID_ARGUMENT once enforcement ships; the unit,
  // its reasons and when it is enforced are on yadgar.task.v1.Task.title.
  string title = 5;
  string body = 6;
  google.protobuf.FieldMask update_mask = 7;
  uint32 number = 8;

  // A GUARD AGAINST A BODY CUT OFF IN TRANSIT: the SHA-256 digest of the body
  // the caller MEANT to send. When set, the edit is refused with
  // INVALID_ARGUMENT unless SHA-256 over `body` equals it, so a body truncated
  // between the caller and this service is refused rather than stored.
  //
  // THE DIGEST IS OVER THE EXACT UTF-8 BYTES OF `body`, with no normalisation:
  // no trimming, no line-ending conversion, and a trailing newline counts.
  //
  // THE FIELD IS THE 32 RAW DIGEST BYTES, NOT A HEX STRING. Hex exists only on
  // the gateway's MCP surface, which takes 64 lowercase hex characters and
  // decodes them before it sends this field.
  //
  // EMPTY MEANS NO GUARD, which is what every caller that predates this field
  // sends. Present, it must be exactly 32 bytes, or the edit is refused. It is
  // refused as well when the mask does not write `body`: there is then no body
  // to check, and a caller sending a digest believes there is.
  //
  // A MODEL CANNOT COMPUTE THIS IN ITS HEAD. A caller holds the body in a file
  // and hashes that file (`sha256sum`), then sends the same file's content.
  //
  // IN PATCH MODE THE DIGEST IS OVER THE PRE-EDIT BODY, as stored (ADR-1008).
  // The caller pins the body it read; a mismatch is refused with
  // FAILED_PRECONDITION and the reason token BODY_SHA256_MISMATCH. The result
  // body is computed by this service, so the caller cannot hash it.
  bytes expect_body_sha256 = 9;

  // PATCH MODE: replace a literal substring of the stored body (ADR-1008),
  // instead of sending the whole body. The result is written as a whole body.
  //
  // SELECTED BY NAMING `patch` IN `update_mask` AND SENDING THIS MESSAGE. One
  // without the other is refused with INVALID_ARGUMENT. `patch` and `body` are
  // mutually exclusive: a mask naming both, or an empty mask with a patch, is
  // refused with INVALID_ARGUMENT. `title` may be written in the same edit.
  // A service that predates this field refuses a mask naming `patch`, so a
  // patch is never silently dropped.
  //
  // `expect_version` stays required; the compare-and-set covers the
  // read-modify-write.
  //
  // REASON TOKENS. A FAILED_PRECONDITION from patch mode carries a message that
  // starts with an upper-case reason token and a colon, for a program to
  // branch on:
  //   PATCH_COUNT_MISMATCH    `old` does not occur exactly `expect_count` times.
  //   PATCH_RESULT_TOO_LARGE  the result body is over 1048576 bytes.
  //   BODY_SHA256_MISMATCH    the stored body does not match expect_body_sha256.
  BodyPatch patch = 10;
}

// A literal search-and-replace over a task body (ADR-1008).
//
// MATCHING IS LITERAL, over the exact UTF-8 bytes of the stored body: no regex,
// no case folding, no Unicode normalisation. A precomposed character does not
// match its decomposed form.
//
// OCCURRENCES ARE COUNTED NON-OVERLAPPING, LEFT TO RIGHT, and every one counted
// is replaced. In "aaa", `old` "aa" occurs once, at the start.
message BodyPatch {
  // Non-empty, at most 65536 bytes. Refused with INVALID_ARGUMENT otherwise.
  string old = 1;
  // At most 65536 bytes; empty deletes each occurrence.
  string new = 2;
  // At least 1. The edit is refused with FAILED_PRECONDITION
  // (PATCH_COUNT_MISMATCH) unless `old` occurs exactly this many times.
  uint32 expect_count = 3;
}

message EditTaskResponse {
  yadgar.common.v1.Meta meta = 1;
}

// A status change is a REQUEST, not a field write.
//
// Status is deliberately absent from EditTaskRequest. A plain field write cannot
// express which transitions are legal, so that rule would have to live in every
// caller — which is how it stops being a rule. A dedicated RPC makes the legal
// set a property of the contract instead.
message TransitionTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  // Exactly one of `id` or `number`, with the same rules and the same reach as
  // on EditTaskRequest: `number` is 0 when absent and resolves in the caller's
  // exact project only.
  string id = 3;
  uint64 expect_version = 4;
  yadgar.task.v1.TaskStatus to = 5;
  uint32 number = 6;
}
message TransitionTaskResponse {
  yadgar.common.v1.Meta meta = 1;
  // What it moved FROM, so a caller that raced another writer sees what actually
  // happened rather than assuming its own read was current.
  yadgar.task.v1.TaskStatus from = 2;
}

message RemoveTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message RemoveTaskResponse {}

// Holds no store. Reaches its data ONLY over TaskDbService, never by opening a
// connection of its own — which is what makes the twin a connection
// concentrator rather than merely a boundary (D4).
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc ReadTask(ReadTaskRequest) returns (ReadTaskResponse);
  rpc FindTasks(FindTasksRequest) returns (FindTasksResponse);
  rpc EditTask(EditTaskRequest) returns (EditTaskResponse);
  rpc TransitionTask(TransitionTaskRequest) returns (TransitionTaskResponse);
  rpc RemoveTask(RemoveTaskRequest) returns (RemoveTaskResponse);
}
