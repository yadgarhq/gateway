# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that HAPPEN to look like YAML —
        # `{{- toYaml ... }}` is a syntax error to any real parser. Excluding
        # them is not lowering the bar: `helm lint` and `helm template` are the
        # checks that actually apply, and they run in CI.
        exclude: ^chart/templates/
      - id: check-toml

  # Shared, from yadgarhq/actions (D62). IMMUTABLE rev: pre-commit caches a rev
  # at first install and never re-resolves it, so a moving tag would silently
  # freeze each machine at whatever it meant the day it first ran.
  - repo: https://github.com/yadgarhq/actions
    rev: v1.5.0
    hooks:
      - id: gitleaks
      - id: prettier
        exclude: ^(chart/templates/|proto/)
      - id: hadolint
      - id: cargo-fmt
      - id: cargo-clippy
      - id: cargo-deny
      - id: observe-coverage
      - id: helm-lint

  # ADR-0569's gate, and REPO-LOCAL deliberately rather than shared from
  # yadgarhq/actions. That repository has no Cargo.toml, so `ci / test` skips
  # there and a shared hook's first real execution would be post-merge in a
  # consumer repo — unverified-on-PR is the wrong property for the one hook whose
  # whole job is refusing a bad merge.
  #
  # always_run with pass_filenames: false, because the property is about the
  # WHOLE tree: a commit touching only the chart must still fail if `fn env_or`
  # is sitting in src/, and a filename-scoped hook would pass it.
  - repo: local
    hooks:
      - id: no-compiled-in-defaults
        name: ADR-0569 — no compiled-in configuration default
        entry: scripts/no_compiled_in_defaults.sh
        language: script
        always_run: true
        pass_filenames: false
