# Dependabot. Per-repository by necessity — this file has to live in each repo,
# unlike CI, which is defined once in yadgarhq/actions (D62).
#
# The github-actions ecosystem is the load-bearing one. Every third-party action
# is SHA-pinned (D62), and a SHA is a pin that nobody notices going stale:
# resolving them by hand once found SEVEN OF TWELVE were behind. Dependabot
# turns that from an audit somebody has to remember into a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A version published minutes ago has been exercised by nobody. A week
    # costs nothing and skips the releases that get yanked.
    cooldown:
      default-days: 7
    groups:
      # One PR rather than a dozen. These move together and reviewing them
      # together is how the version-and-SHA pair stays legible.
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A version published minutes ago has been exercised by nobody. A week
    # costs nothing and skips the releases that get yanked.
    cooldown:
      default-days: 7
    groups:
      # Patch and minor together; a major is worth its own PR and its own read.
      minor-and-patch:
        update-types: [minor, patch]
    # ADR-0690: these four crates' git tags got proposed as downgrades
    # wearing the word "bump" once a patch number reached two digits — ADR-0690
    # attributes this to Dependabot ordering the tags lexically rather than by
    # semver ("v0.2.9" > "v0.2.10" on a character comparison). Observed as
    # nineteen closed reversal pull requests, one confirmed by diff
    # (gateway#85 rewrote both Cargo.toml's tag and Cargo.lock's locked
    # commit sha to the older release). The exclusion below does not depend
    # on that attribution being the whole story; it stops the channel for
    # these four names regardless of cause.
    #
    # A `dependency-name` entry with no `versions`/`update-types` ignores ALL
    # versions for that name — dependabot-core's own IgnoreCondition returns
    # ">= 0" in that case, checked against source rather than assumed — so
    # this is a full stop for these four names, not a filtered subset. Third-
    # party registry crates in this ecosystem are unaffected; `dependency-
    # name` matches only these literal names.
    #
    # Checked against the `groups:` block above, not just the ungrouped
    # path: dependabot-core issue #10122 (open) reports partial ignores
    # (major/minor-only) leaking through group semver-classification.
    # `updater/lib/dependabot/updater/group_update_creation.rb`'s
    # `compile_updates_for` builds the checker with the same
    # `ignore_conditions_for(dependency)`, and a bare `dependency-name` match
    # (all versions ignored) exits at `all_versions_ignored?` before
    # `semver_rules_allow_grouping?` ever runs — the code path #10122
    # concerns. A full ignore is unaffected by that bug.
    #
    # This is not a version-update pause. The pins are frozen behind the
    # semver-greatest tags, and closing that gap is a deliberate re-pin round
    # with tests, tracked separately — not a Dependabot bump.
    ignore:
      - dependency-name: "yadgar-telemetry"
      - dependency-name: "yadgar-lifecycle"
      - dependency-name: "yadgar-dial"
      - dependency-name: "yadgar-store"
