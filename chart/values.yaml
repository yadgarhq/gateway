# In git the image points at a moving TAG; the PUBLISHED chart pins a DIGEST,
# rewritten by ci-release at package time (D65).
image:
  repository: ghcr.io/yadgarhq/gateway
  tag: latest

# At least two, always (D55) — load-bearing here too: Envoy Gateway balances
# ordinary L4/L7 traffic across whatever the Service has, so a single replica
# would make every request a single point of failure at the one place all
# traffic already funnels through.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# The task logic service, over gRPC (D16).
task:
  host: task
  port: 50052

  # The TRANSPORT to that service. Everything behind the TLS edge is cleartext
  # today, so every task body and every tool argument crosses the pod network in
  # the open; this is the seam that closes it, one hop at a time.
  #
  # PATHS AND A FLAG, NEVER AN ISSUER-SPECIFIC RESOURCE (D80). The chart names a
  # Secret and a key inside it, and the binary is handed a file path. In the
  # reference deployment cert-manager writes that Secret; on EKS a Secret
  # assembled by hand produces something neither the chart nor the binary can
  # tell apart. Nothing here requires a CRD, an issuer or a mesh.
  #
  # PER UPSTREAM, and `iam.tls` below is its twin. The two are cut over one at a
  # time — a single flag would make that all-or-nothing, which is the opposite
  # of a change that can be reverted on its own.
  tls:
    # OFF, and it stays off until the servers can answer. **task does not serve
    # TLS yet**, so turning this on today breaks the hop rather than securing
    # it. The code ships first and the cut-over is a separate, revertible change
    # — the same discipline trustUnauthenticatedHeaders' cut-over used.
    #
    # THERE IS NO SILENT MIDDLE STATE. `true` with no usable bundle fails at
    # boot naming the file; it never falls back to cleartext, and it never falls
    # back to the platform trust store. `false` with a bundle still configured
    # is the reverted state, and gateway logs a warning saying the hop is in
    # cleartext so nobody has to infer it.
    enabled: false
    # The Secret holding the authority that signed task's certificate.
    #
    # A SECRET, THOUGH A CA IS PUBLIC — because that is where an issuer actually
    # writes it. Reading it here claims no confidentiality the certificate does
    # not have.
    #
    # NOT A PEM PASTED INTO THIS FILE. The authority rotates, and a copy in git
    # is correct only until the rotation nobody remembered to follow.
    caSecret: task-tls
    # The key inside that Secret which holds the bundle, mounted as `ca.pem`.
    # Named rather than assumed: `ca.crt` is what cert-manager calls it, and a
    # Secret assembled by hand for a deployment cert-manager does not run in is
    # free to call it something else.
    caSecretKey: ca.crt
    # The name task's certificate is verified against, when it is NOT
    # `task.host`.
    #
    # EMPTY IS THE RIGHT ANSWER ALMOST ALWAYS. Client-side balancing dials pod
    # ADDRESSES, and a certificate names a HOST — so leaving this empty verifies
    # against the Service name above, which is what lets one certificate issued
    # for the Service work across every pod behind it. Set it only for a
    # certificate issued for something else, such as a per-namespace FQDN.
    domain: ""

# The iam logic service. THE WHOLE CREDENTIAL LIFECYCLE now goes here: POST
# /auth/login and POST /auth/enrol issue a token (D75, D73), and attestation
# resolves one on every tools/call (ADR-0488).
#
# IT IS ATTESTATION NOW, and this comment used to say the opposite. It said
# gateway "still trusts the caller's headers", and that the identity half lived
# behind a DIFFERENT variable, YADGAR_IAM_ADDR, which was a boot-killer because
# that half was unimplemented. The half is built, the variable is deleted, and this
# is the one address for the one service. trustUnauthenticatedHeaders below is now
# an explicit opt-OUT rather than the only implemented road.
#
# `iam`'s Service is a VIP rather than headless, so this pins to one connection
# rather than balancing across replicas. That was sized for the rate a person types
# a password at, and attestation put far more traffic through it — which is what
# credentialCache below reduces (D72: "on a cache miss, never per request").
# Revisit if the miss rate makes one connection a bottleneck; the hit rate is
# visible in yadgar_gateway_credential_cache_total. See `upstream::connect_iam`.
#
# ORDERING-SAFE, and the cost of being out of order is higher than it was. The
# channel is lazy, so this name is not resolved at startup and installing gateway
# before `iam` exists still starts. It no longer costs "a 503 on /auth/login and
# nothing on /": an `iam` that cannot answer stops MCP traffic too, because that is
# where identity comes from. A pod that refused to BOOT would still be worse — D68's
# autoscaler cannot help one stuck in startup.
iam:
  host: iam
  port: 50052

  # The TRANSPORT to that service, and the hop with the most to lose: the bearer
  # token itself goes down it, on `/auth/login`, on `/auth/enrol` and on every
  # attested `tools/call`. On a flat pod network anyone on the network reads it.
  #
  # SAME SHAPE AS `task.tls` ABOVE, and configured independently of it, so the
  # two can be cut over one at a time.
  #
  # **THIS CHANNEL DOES NOT GO THROUGH `yadgar-dial`**, because iam's Service is
  # a VIP rather than headless (D23) — see `upstream::connect_iam`. It gets the
  # same values and the same guarantees anyway: a second implementation, held to
  # the same list, and proved by real handshakes in tests/iam_tls.rs rather than
  # by showing that a configuration was attached.
  tls:
    # OFF, and it stays off until the servers can answer. **iam does not serve
    # TLS yet**, so turning this on today breaks the hop rather than securing
    # it. The code ships first and the cut-over is a separate, revertible
    # change.
    #
    # THERE IS NO SILENT MIDDLE STATE. `true` with no usable bundle fails at
    # boot naming the file — and it fails EAGERLY, even though the iam channel
    # is otherwise lazy, because a bundle depends on the deployment that wrote
    # it rather than on iam existing. `false` with a bundle still configured is
    # the reverted state, and gateway logs a warning saying so.
    enabled: false
    # The Secret holding the authority that signed iam's certificate. A Secret
    # though a CA is public, because that is where an issuer writes it; not a
    # PEM pasted into this file, because the authority rotates.
    caSecret: iam-tls
    # The key inside that Secret which holds the bundle, mounted as `ca.pem`.
    # Named rather than assumed — `ca.crt` is cert-manager's name for it, and a
    # hand-assembled Secret may use another.
    caSecretKey: ca.crt
    # The name iam's certificate is verified against, when it is NOT `iam.host`.
    # Empty verifies against the Service name above, which is almost always
    # right. Set it only for a certificate issued for something else.
    domain: ""

# D72's cache in front of `iam.ResolveCredential`, so identity is not a round trip
# on every tools/call. Keyed on a hash of the bearer token, held IN EACH REPLICA'S
# OWN MEMORY rather than in the shared cache (D21) — the reasoning is on
# `attest::Credentials`, and the short form is that attestation runs before D74's
# limiter, so an unauthenticated caller decides how many keys the cache gains and
# that keyspace must not sit in a 512MB LRU shared with four other subsystems.
#
# **ttlSeconds IS A SECURITY PARAMETER, NOT A TUNING KNOB.** ADR-0491 says the
# cache is "invalidated by a broker event, never by calling iam per request", and
# and the `nats` block below is where that event is consumed. So this number is
# the BACKSTOP for a missed event rather than the mechanism — and it becomes THE
# ONLY BOUND on how long a credential revoked in `iam` keeps working here whenever
# the broker is unreachable, which gateway says in a warning at every boot it is
# not consuming. Anything above 300 is refused: that is `iam`'s own declared
# lifetime for a live credential, and a cache of a thing may not outlive it.
#
# 30 buys almost the whole hit rate: a client making one call a second is served
# thirty times per lookup. Raising it to 300 multiplies the missed-event window by
# ten to buy the last few percent.
#
# `0` disables the cache and restores the per-request round trip. It is the revert,
# and it needs no new image — the same shape as trustUnauthenticatedHeaders below.
credentialCache:
  ttlSeconds: 30

# The broker (D22), carrying the cache invalidation `iam` publishes on a
# revocation or a team change. NOT a startup dependency: gateway is the only
# ingress in the system, so a boot gate here would turn a broker outage into a
# total outage of every MCP call. It starts, says at every boot that it is NOT
# consuming, retries, and credentialCache.ttlSeconds above is the bound meanwhile.
nats:
  # SET, BECAUSE THE ACCOUNT NOW EXISTS. `yadgarhq/deploy#15` merged: the broker's
  # authorization block declares a `gateway` user with `subscribe.allow` on
  # exactly the two subjects below and `publish.deny: ">"`, and the Secret named
  # below holds its password. Both halves of the cut-over are in place, so this
  # points at the broker and the consumer runs.
  #
  # **THE ORDER MATTERED AND NO LONGER DOES.** A NATS server with an authorization
  # block REFUSES a credential-less CONNECT — `-ERR 'Authorization Violation'`,
  # connection closed, exactly as for a wrong password — so pointing at this broker
  # without an account was never "connects unauthenticated": it was every pod
  # refused, consuming nothing, redialling for ever. That is why this value waited
  # for the account rather than shipping ahead of it.
  #
  # EMPTY IS STILL A SUPPORTED STATE and is the revert: no broker is dialled,
  # nothing is consumed, and credentialCache.ttlSeconds above is the bound. It is
  # read BEFORE the credential below, so clearing this one value turns the whole
  # block off. See MIGRATION_NOTES.md.
  #
  # **WITH THIS SET, THE SECRET BELOW IS A HARD PREREQUISITE AND ITS ABSENCE
  # FAILS THE BOOT.** While this was empty, passwordSecret was inert: the binary
  # stopped at the url and never looked for the password. Set, it looks — and the
  # Secret mount is `optional: true`, so a missing Secret is an empty directory
  # rather than a stuck pod, the file is not there, and gateway EXITS naming
  # /var/run/secrets/nats/password. That is deliberate and it is loud, but it is a
  # boot failure rather than a degraded start: do not point this at a broker in a
  # cluster where nats-auth-gateway does not exist. Clear this url instead.
  url: nats://nats:4222

  # The Secret holding this gateway's OWN broker password.
  #
  # NOT `iam`'s. The broker's authorization block names one account per service so
  # that any single service's access can be revoked; sharing one credential would
  # also let a subscriber publish, and this service has no business publishing on
  # a subject `iam` owns.
  #
  # EMPTY IS A FULLY SUPPORTED STATE — an adopter whose broker declares no
  # authorization block clears this and gateway connects with no credential. It is
  # not the reference deployment's state: that broker demands one, and a gateway
  # without it is REFUSED rather than connected. The cost of getting this wrong is
  # loud either way: a pod that exits at boot naming
  # `/var/run/secrets/nats/password`, or one whose log says the broker refused it.
  #
  # `nats-auth-gateway` is the Secret `yadgarhq/deploy` creates for this service's
  # OWN account. It is inert whenever `url` above is empty, because the binary
  # reads the url first and stops there — which is what let this value land before
  # the account did.
  #
  # AN ADOPTER SUPPLIES IT HOWEVER THEY LIKE (D80). The chart names a Secret and
  # mounts a key from it, so Vault, External Secrets, SOPS or a cloud secret
  # manager substitute for however the reference deployment creates it, and this
  # chart is unchanged.
  passwordSecret: nats-auth-gateway
  # The key inside that Secret which holds the password, mounted as `password`.
  # Named rather than assumed, for the same reason the CA keys are: a Secret
  # assembled by hand is free to call it something else.
  passwordSecretKey: password
  # The account this service authenticates as, which must match a user in the
  # broker's `authorization` block. Required whenever `passwordSecret` is set: the
  # block names an account and a password together, and gateway refuses to start
  # with one and not the other, in BOTH directions.
  user: gateway

# D74's token buckets: one per (user, module, kind), held in the shared cache
# (D21) so every replica of this Deployment spends from the same one. A
# per-replica bucket would silently multiply every limit below by replicaCount.
#
# `addr` is REQUIRED and gateway exits without it. That is not the same rule as
# what happens when Valkey is unreachable at runtime — then the call PROCEEDS,
# held to a local floor of rate/maxReplicas on each replica, and says so loudly
# in yadgar_gateway_rate_limit_degraded_total. The reasoning is on
# `limit::Decision::Degraded`; the short form is that this valkey is one replica
# with no persistence, and failing closed would make it a hard dependency of
# every user-attributed call at the one hop all traffic already funnels through.
# The floor is what keeps failing open from meaning "no limit at all": six
# replicas at rate/6 sum to the configured rate and never more.
rateLimit:
  addr: valkey:6379
  # `<module>.<kind>=<rate>:<burst>`, comma separated. `rate` is the sustained
  # refill per second and `burst` is the bucket's size, so a caller may spend
  # `burst` at once and is then held to `rate`.
  #
  # SET GENEROUSLY, and this is D74's own instruction rather than timidity: an
  # empty bucket refills at `rate` rather than being handed a fresh allowance
  # each minute, so a badly chosen rate is felt permanently rather than in
  # bursts. The per-user override in `iam` exists to handle the exception, not
  # to paper over a bad default.
  #
  # Writes are tighter than reads because the damage D74 protects against is a
  # loop WRITING ten thousand tasks — there the writing is the failure, and
  # refusing it is the only response that helps.
  limits: task.write=2:120,task.read=20:600
  # The bucket for a (module, kind) nobody named above. A new tool is limited
  # rather than unlimited on the day it ships; the alternative is a tool that
  # goes unprotected until somebody remembers to add a line here.
  default: "10:300"
  # Milliseconds. This is on the hot path of every user-attributed call, at the
  # one hop all traffic passes through, so a hung round trip to the cache must
  # not become the gateway's latency. A timeout degrades exactly like an
  # unreachable cache: the call proceeds, and the counter says it did.
  timeoutMs: 20

  # The Secret holding the cache's `requirepass` (ledger 518).
  #
  # SET BY DEFAULT, unlike `task.tls` above, and the difference is worth the
  # paragraph. That value is off by default because turning it on against a
  # server which cannot answer BREAKS the hop. This one is on by default because
  # the reference deployment has nowhere else to put it: `yadgarhq/argocd`'s
  # ApplicationSet enumerates modules rather than listing them (D54), so its Helm
  # values are uniform across every module and cannot carry a per-module Secret
  # name. The module's own values.yaml is the override point that comment names.
  #
  # AN ADOPTER WHOSE CACHE HAS NO PASSWORD CLEARS THIS, and empty is a fully
  # supported state: the chart then sends the binary no password variable, and it
  # dials the cache exactly as every deployment did before this. The cost of
  # getting it wrong is loud rather than silent — a pod that exits at boot naming
  # `/var/run/secrets/valkey/password`, not one that quietly serves.
  #
  # THE SECRET MUST EXIST BEFORE THIS CHART SYNCS. It is not created here and not
  # in git; `yadgarhq/deploy`'s MIGRATION_NOTES.md has the `kubectl create secret`
  # for it, alongside the one the cache itself reads. Same object, both ends.
  #
  # WHILE IT IS EMPTY THE HOP IS UNAUTHENTICATED and gateway says so in a warning
  # at every boot. Anything on the pod network can read and rewrite D74's token
  # buckets: reset one to grant unlimited capacity, or empty one to throttle a
  # named user. The cache also holds D18's epoch counters, D29's conversation
  # tokens and D46's throttle counters, none of which are this chart's to fix.
  #
  # A SECRET, AND A PASSWORD IS ACTUALLY SECRET — unlike the CA bundles above,
  # which are Secrets only because that is where an issuer writes them. It is
  # mounted as a FILE rather than read into an environment variable, because an
  # environment variable is visible in `kubectl describe pod` and to every
  # `/proc/<pid>/environ` in the container.
  #
  # NOT A PASSWORD PASTED INTO THIS FILE, and not one spliced into `addr` above.
  # A published chart is a public artefact, and a credential in `addr` would be a
  # credential in every `helm get values` and every Argo diff.
  #
  # THERE IS NO SILENT MIDDLE STATE, and the two halves fail differently on
  # purpose. Set with no readable, non-empty file behind it: the pod exits at boot
  # naming the path, because a deployment that asked for a credential and cannot
  # produce one has a mistake in it. Unset against a cache that DOES demand a
  # password: the pod starts (nothing dials the cache at boot, deliberately) and
  # the first call is REFUSED with a 503 — not held to the degraded floor an
  # UNREACHABLE cache gets. The floor exists for an outage, which ends; a refused
  # credential does not end, and failing open onto the floor for ever would be a
  # rate limiter that reads healthy while enforcing a sixth of what it says.
  passwordSecret: valkey-password
  # The key inside that Secret which holds the password, mounted as `password`.
  # Named rather than assumed, for the same reason the CA keys above are: a Secret
  # assembled by hand is free to call it something else.
  passwordSecretKey: password

# DEVELOPMENT ONLY, and the switch is now thrown.
#
# Setting this trusts the identity the caller attaches to its own request, with
# nothing behind it verifying that claim. `false` makes gateway resolve the
# request's bearer token through `iam.ResolveCredential` instead, which is the
# shipped default in the binary and what every deployment should end up on.
#
# **`false`, WHICH IS THE CUT-OVER.** MIGRATION_NOTES.md set four preconditions
# and all four now hold: `iam` is deployed and reachable, the running image
# refuses an empty `user_id` (the guard shipped in v0.5.0), the client sends
# `Authorization: Bearer` from an enrolment it completed itself, and it still
# sends `x-yadgar-project` — a workspace fact no token can carry. It deliberately
# sends no `x-yadgar-user`, which this value is what made safe to ignore.
#
# It stays as a value rather than being deleted, for one release, because the
# whole point of a separate change is that it can be reverted on its own. Deleting
# the flag outright is the step after this one.
trustUnauthenticatedHeaders: false

# D68: scale on CONCURRENCY, not CPU. gateway is a synchronous, sync-gRPC-class
# service in D68's table — it waits on `task` for every call, so it saturates
# at low CPU exactly like the logic services it fronts.
#
# The signal is call RATE per replica, read from D67's metrics — the same
# `yadgar_calls_total` series every service emits, scoped to this chart's name.
# Rate rather than an in-flight gauge because nothing tracks in-flight requests
# yet: rate is what the instrumentation actually exposes today, and pretending
# otherwise would give a scaler that reads nothing. Stated here rather than
# silently substituted.
autoscaling:
  # D80: KEDA's CRD is not something every adopter has installed. `false` here
  # is the chart's own default so `helm template`/`helm install` succeed on a
  # bare cluster; the reference deployment in yadgarhq/deploy sets this true
  # (autoscaling.enabled=true in its values for this chart) to get the scaling
  # behaviour described below.
  enabled: false
  minReplicas: 2
  # At least two, always (D55) — the floor is a correctness property, not a
  # tuning knob: one replica makes a class of defect unreachable.
  maxReplicas: 6
  # Calls per second per replica before adding one.
  threshold: "10"
  prometheusAddress: http://prometheus-server.observability.svc.cluster.local

# The Service this chart creates. Named here because the HTTPRoute forwards to
# it by port number, and two literals that must agree are one literal too many.
service:
  port: 8080

# Where this service attaches to the TLS edge (D71). The Gateway and its
# certificate live in yadgarhq/deploy — shared edge infrastructure outlives any
# one module — while the HTTPRoute lives in this chart, so the route and the
# backend it names share a lifecycle.
#
# `listener` is the Gateway's listener NAME, not just the Gateway: a Gateway may
# carry several, and attaching to the wrong one serves this on a hostname nobody
# expects. `hostname` must match what the certificate was issued for AND what the
# root CA's nameConstraints extension permits — three places that have to agree,
# or verification fails after signing succeeds. A hostname the listener does not
# serve fails more quietly than that: the route simply never attaches.
#
# .internal rather than .localhost, and the change is not cosmetic. RFC 6761
# §6.3.3 says resolvers SHOULD return loopback for .localhost names, and clients
# on one machine disagree about it: measured from a Debian VM with an /etc/hosts
# entry, `getent`, Python and `wget` all resolved the old name to the host's
# bridge address and wget reached the gateway, while curl returned loopback —
# curl implements §6.3.3 itself and never consults NSS. A name that resolves for
# some clients and not others is harder to diagnose than one that fails cleanly,
# and curl is the tool everyone diagnoses with. .internal is reserved by ICANN
# (Board Resolution 2024.07.29.06) from the DNS root zone for private use, and no
# resolver treats it specially — it is NOT an IETF special-use domain — so it
# resolves wherever the local network says. Moving it needs the root CA reissued
# under a matching name constraint; the ordering is in yadgarhq/deploy's
# MIGRATION_NOTES.
gateway:
  # D80: an HTTPRoute needs the `gateway.networking.k8s.io` CRD, which does not
  # exist on a cluster whose ingress is not a Gateway API implementation. `true`
  # is the reference-deployment default — yadgarhq/deploy runs Envoy Gateway and
  # ships this chart against it unmodified.
  #
  # SET FALSE ON ANY OTHER INGRESS. This chart still creates its own Service
  # (see `service.port` above) whether the route is enabled or not; set this to
  # false and point your own Ingress, NGINX, Traefik, HAProxy, ALB or
  # Application Gateway config at that Service by name and port. The chart
  # never creates that Ingress object for you — its shape is specific to the
  # ingress in use, which is exactly what this value exists to keep out of the
  # chart.
  enabled: true
  name: edge
  listener: https
  hostname: gateway.yadgar.internal

# WHERE A REQUEST CAME FROM, and whether this deployment can vouch for it
# (ADR-0491, D80).
#
# ADR-0491 requires a source address on every authentication event including
# failures, "read from X-Forwarded-For and trusted only from the known proxy".
# This block is where the known proxy is declared, and it is the only place.
sourceAddress:
  # HOW MANY PROXIES APPEND TO `X-Forwarded-For` between a client and this
  # gateway. The gateway reads the entry that many places from the RIGHT — each
  # proxy appends the address it saw, so the rightmost entry is the one the hop
  # nearest this gateway wrote, and everything to the left of the declared depth
  # is text the caller could have sent.
  #
  #   ""  unknown; the shipped default. See below.
  #   "0" this gateway is exposed directly, so the peer address IS the client's.
  #   "1" one ingress in front. This is the usual answer.
  #   "2" an ingress behind a cloud load balancer that also appends.
  #
  # THE DEFAULT REFUSES, and this is the one place where the safe default and the
  # convenient default point opposite ways. Unset means UNKNOWN, and an unknown
  # address is recorded as NOTHING rather than guessed from the header — because
  # the naive guess is the LEFTMOST entry, and that is precisely the entry the
  # caller controls. An audit record carrying a forged address is worse than one
  # carrying none: the empty field is honestly empty, the forged one reads as
  # evidence.
  #
  # WHAT LEAVING IT UNSET COSTS, stated plainly rather than left to be
  # discovered. Two things, and neither is an outage:
  #   1. Authentication events carry no source address at all.
  #   2. /auth/login and /auth/enrol are bounded per OBSERVED HOP instead of per
  #      client — behind an ingress that is ONE bucket shared by everybody, so
  #      credentialLimits.unattributed below applies rather than
  #      credentialLimits.attributed.
  #
  # A HOP COUNT AND NOT AN INGRESS RESOURCE (D80). An earlier revision of this
  # work prescribed an Envoy Gateway ClientTrafficPolicy and was retracted: it
  # would make the integrity of an audit record a property of running Envoy, and
  # yadgar must run on EKS, AKS, GKE and behind NGINX, Traefik, HAProxy, an ALB
  # or an Application Gateway. Every ingress worth deploying behind appends to
  # this header; what differs is only how many entries it adds. That difference
  # is the number here, declared once for whichever ingress you run.
  #
  # TRUSTED RANGES ARE NOT AN OPTION HERE, deliberately. A CIDR list answers the
  # same question this number answers, at the cost of a parser and a second way
  # to configure one property. If a deployment appears whose chain depth is not
  # constant, that is when to add it — and not before.
  #
  # A VALUE THAT IS NOT A WHOLE NUMBER IS A BOOT FAILURE, not a fall back to the
  # default. The default refuses, so a typo silently taken would look exactly
  # like a deployment that never configured this, and the operator who set it
  # would never learn their audit records carry no address.
  trustedProxyHops: ""

# WHAT BOUNDS THE TWO UNAUTHENTICATED ENDPOINTS (ledger 497).
#
# /auth/login and /auth/enrol are the only surfaces a stranger reaches with no
# credential, and each costs `iam` a full Argon2id verification whether or not
# the username exists — it is required to, so that timing cannot enumerate
# accounts. So they are a password-guessing surface AND a CPU amplifier.
#
# D74'S BUCKETS CANNOT COVER THEM. Those key on (user, module, kind), and a login
# has no user until it succeeds. These bucket on the SOURCE ADDRESS instead, in
# their own key space, with their own rates — the numbers below.
#
# `<rate>:<burst>`, the same spelling rateLimit above uses: `rate` is the
# sustained refill per second and `burst` is the bucket's size.
credentialLimits:
  # PER CLIENT, and only reachable once sourceAddress.trustedProxyHops is set.
  # This is the GUESS-PREVENTION number, sized for a person typing a password: a
  # handful of attempts at once, then one every five seconds. Nobody types faster
  # than this; a guesser is held to about 17,000 attempts a day from one address,
  # each against an Argon2id hash.
  attributed: "0.2:10"
  # PER OBSERVED HOP, which is what applies while no trust boundary is declared.
  # Behind an ingress that is ONE address for every caller in the installation,
  # so this bucket is shared by everybody.
  #
  # DELIBERATELY LOOSE, AND IT IS A DIFFERENT CONTROL RATHER THAN A WEAKER ONE.
  # Putting the guess-prevention number above on a shared key would let one
  # attacker at that rate refuse every login for everybody — a limiter that is
  # itself the outage. So this one bounds the OTHER half of the exposure: the
  # Argon2id CPU an unauthenticated stranger can spend. At ~50ms per attempt in
  # `iam`, 10/s is about half a core's worth of hashing, which is a bound rather
  # than a barrier.
  #
  # GUESS PREVENTION ARRIVES WHEN YOU DECLARE THE BOUNDARY. If that matters to
  # your deployment, set sourceAddress.trustedProxyHops.
  unattributed: "10:100"
