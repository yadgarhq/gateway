# In git the image points at a moving TAG; the PUBLISHED chart pins a DIGEST,
# rewritten by ci-release at package time (D65).
image:
  repository: ghcr.io/yadgarhq/gateway
  tag: latest

# At least two, always (D55) — load-bearing here too: Envoy Gateway balances
# ordinary L4/L7 traffic across whatever the Service has, so a single replica
# would make every request a single point of failure at the one place all
# traffic already funnels through.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# The task logic service, over gRPC (D16).
task:
  host: task
  port: 50052

# The iam logic service. THE WHOLE CREDENTIAL LIFECYCLE now goes here: POST
# /auth/login and POST /auth/enrol issue a token (D75, D73), and attestation
# resolves one on every tools/call (ADR-0488).
#
# IT IS ATTESTATION NOW, and this comment used to say the opposite. It said
# gateway "still trusts the caller's headers", and that the identity half lived
# behind a DIFFERENT variable, YADGAR_IAM_ADDR, which was a boot-killer because
# that half was unimplemented. The half is built, the variable is deleted, and this
# is the one address for the one service. trustUnauthenticatedHeaders below is now
# an explicit opt-OUT rather than the only implemented road.
#
# `iam`'s Service is a VIP rather than headless, so this pins to one connection
# rather than balancing across replicas. That was sized for the rate a person types
# a password at, and attestation puts far more traffic through it — revisit when
# the credential lookup gets its cache (D72: "on a cache miss, never per request"),
# which is what should be reducing that traffic. See `upstream::connect_iam`.
#
# ORDERING-SAFE, and the cost of being out of order is higher than it was. The
# channel is lazy, so this name is not resolved at startup and installing gateway
# before `iam` exists still starts. It no longer costs "a 503 on /auth/login and
# nothing on /": an `iam` that cannot answer stops MCP traffic too, because that is
# where identity comes from. A pod that refused to BOOT would still be worse — D68's
# autoscaler cannot help one stuck in startup.
iam:
  host: iam
  port: 50052

# D74's token buckets: one per (user, module, kind), held in the shared cache
# (D21) so every replica of this Deployment spends from the same one. A
# per-replica bucket would silently multiply every limit below by replicaCount.
#
# `addr` is REQUIRED and gateway exits without it. That is not the same rule as
# what happens when Valkey is unreachable at runtime — then the call PROCEEDS,
# held to a local floor of rate/maxReplicas on each replica, and says so loudly
# in yadgar_gateway_rate_limit_degraded_total. The reasoning is on
# `limit::Decision::Degraded`; the short form is that this valkey is one replica
# with no persistence, and failing closed would make it a hard dependency of
# every user-attributed call at the one hop all traffic already funnels through.
# The floor is what keeps failing open from meaning "no limit at all": six
# replicas at rate/6 sum to the configured rate and never more.
rateLimit:
  addr: valkey:6379
  # `<module>.<kind>=<rate>:<burst>`, comma separated. `rate` is the sustained
  # refill per second and `burst` is the bucket's size, so a caller may spend
  # `burst` at once and is then held to `rate`.
  #
  # SET GENEROUSLY, and this is D74's own instruction rather than timidity: an
  # empty bucket refills at `rate` rather than being handed a fresh allowance
  # each minute, so a badly chosen rate is felt permanently rather than in
  # bursts. The per-user override in `iam` exists to handle the exception, not
  # to paper over a bad default.
  #
  # Writes are tighter than reads because the damage D74 protects against is a
  # loop WRITING ten thousand tasks — there the writing is the failure, and
  # refusing it is the only response that helps.
  limits: task.write=2:120,task.read=20:600
  # The bucket for a (module, kind) nobody named above. A new tool is limited
  # rather than unlimited on the day it ships; the alternative is a tool that
  # goes unprotected until somebody remembers to add a line here.
  default: "10:300"
  # Milliseconds. This is on the hot path of every user-attributed call, at the
  # one hop all traffic passes through, so a hung round trip to the cache must
  # not become the gateway's latency. A timeout degrades exactly like an
  # unreachable cache: the call proceeds, and the counter says it did.
  timeoutMs: 20

# DEVELOPMENT ONLY, and now an explicit OPT-OUT rather than the only road.
#
# Setting this trusts the identity the caller attaches to its own request, with
# nothing behind it verifying that claim. Unsetting it — `false` — makes gateway
# resolve the request's bearer token through `iam.ResolveCredential` instead, which
# is the shipped default in the binary and what every deployment should end up on.
#
# **STILL `true` HERE, DELIBERATELY, AND IT IS THE SWITCH TO THROW.** The running
# cluster has it set; flipping it in the same change that implemented attestation
# would have made one roll-out both a code change and a cut-over, with a single
# lever to revert both. The comment that stood here said this flag would be
# "deleted, not merely defaulted to false, the moment `iam` ships" — that moment is
# a separate, revertible change, and see MIGRATION_NOTES.md for what to check
# before it. Deleting the flag outright is the step after that one.
trustUnauthenticatedHeaders: true

# D68: scale on CONCURRENCY, not CPU. gateway is a synchronous, sync-gRPC-class
# service in D68's table — it waits on `task` for every call, so it saturates
# at low CPU exactly like the logic services it fronts.
#
# The signal is call RATE per replica, read from D67's metrics — the same
# `yadgar_calls_total` series every service emits, scoped to this chart's name.
# Rate rather than an in-flight gauge because nothing tracks in-flight requests
# yet: rate is what the instrumentation actually exposes today, and pretending
# otherwise would give a scaler that reads nothing. Stated here rather than
# silently substituted.
autoscaling:
  enabled: true
  minReplicas: 2
  # At least two, always (D55) — the floor is a correctness property, not a
  # tuning knob: one replica makes a class of defect unreachable.
  maxReplicas: 6
  # Calls per second per replica before adding one.
  threshold: "10"
  prometheusAddress: http://prometheus-server.observability.svc.cluster.local

# The Service this chart creates. Named here because the HTTPRoute forwards to
# it by port number, and two literals that must agree are one literal too many.
service:
  port: 8080

# Where this service attaches to the TLS edge (D71). The Gateway and its
# certificate live in yadgarhq/deploy — shared edge infrastructure outlives any
# one module — while the HTTPRoute lives in this chart, so the route and the
# backend it names share a lifecycle.
#
# `listener` is the Gateway's listener NAME, not just the Gateway: a Gateway may
# carry several, and attaching to the wrong one serves this on a hostname nobody
# expects. `hostname` must match what the certificate was issued for AND what the
# root CA's nameConstraints extension permits — three places that have to agree,
# or verification fails after signing succeeds. A hostname the listener does not
# serve fails more quietly than that: the route simply never attaches.
#
# .internal rather than .localhost, and the change is not cosmetic. RFC 6761
# §6.3.3 says resolvers SHOULD return loopback for .localhost names, and clients
# on one machine disagree about it: measured from a Debian VM with an /etc/hosts
# entry, `getent`, Python and `wget` all resolved the old name to the host's
# bridge address and wget reached the gateway, while curl returned loopback —
# curl implements §6.3.3 itself and never consults NSS. A name that resolves for
# some clients and not others is harder to diagnose than one that fails cleanly,
# and curl is the tool everyone diagnoses with. .internal is reserved by ICANN
# (Board Resolution 2024.07.29.06) from the DNS root zone for private use, and no
# resolver treats it specially — it is NOT an IETF special-use domain — so it
# resolves wherever the local network says. Moving it needs the root CA reissued
# under a matching name constraint; the ordering is in yadgarhq/deploy's
# MIGRATION_NOTES.
gateway:
  name: edge
  listener: https
  hostname: gateway.yadgar.internal
