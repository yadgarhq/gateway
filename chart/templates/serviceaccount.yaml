# A ServiceAccount this workload owns (ledger 511).
#
# WHAT THIS IS NOT. It grants nothing — there is no Role and no RoleBinding here,
# because `gateway` calls no Kubernetes API. It exists so that the pod stops
# sharing the namespace's `default` account with every other unnamed workload.
# Every pod has a ServiceAccount whether or not one is named, so the choice was
# never between an identity and no identity; it was between one this Deployment
# owns and one it shares. A shared account cannot be granted a permission, be
# named in an audit trail, or be bound to a cloud role without doing all three for
# everything else in the namespace at once.
#
# THE TOKEN IS OFF, in both places it can be turned off. This field is the
# account's own default for pods that name it; `automountServiceAccountToken:
# false` on the pod spec is the one that actually decides, because the pod spec
# wins where they disagree. Both are set so neither file alone can silently
# reintroduce the mount — and so that a future pod naming this account inherits
# the safe answer rather than the API server's permissive default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
automountServiceAccountToken: false
