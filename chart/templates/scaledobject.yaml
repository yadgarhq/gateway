{{- if .Values.autoscaling.enabled }}
# KEDA, not a bare HPA (D68): it wraps a plain HPA for the concurrency cases,
# handles queue depth natively for the write path, and gives scale-to-zero for a
# disabled plugin (D1). One mechanism instead of prometheus-adapter plus special
# cases.
#
# minReplicaCount is 2 and that is NOT a tuning choice — D55 makes at least two
# replicas a correctness property, because D18's cache coherence, D23's
# client-side balancing and D47's atomic claim are all multi-replica behaviours.
# Allowing this to scale to one would make an entire class of defect unreachable.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Chart.Name }}
spec:
  scaleTargetRef:
    name: {{ .Chart.Name }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  # Slow to scale down, quick to scale up. gateway is the one place every
  # client's long-lived HTTP connection lands, so removing a pod costs more than
  # adding one — the same reasoning D23 applies to a gRPC client's connection.
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.prometheusAddress | quote }}
        # Per-replica rate of SERVED calls: the sum over the deployment divided
        # by the pods serving it. Scaling on the SUM would add replicas as
        # traffic grows even when each pod is idle.
        #
        # `outcome="OK"` IS THE LOAD-BEARING PART OF THIS SELECTOR, and its
        # absence was ledger 586. `yadgar_calls_total` is incremented on the
        # FAILURE path too — `telemetry::observe::Call::run` classifies the error
        # and emits the same series with a different `outcome`, and `Call`'s
        # `Drop` emits one more as `UNRECORDED`. Filtering on `service` alone
        # therefore made a pod answering UNAVAILABLE to every request read
        # identically to a healthy one, and the autoscaler added replicas around
        # a pod that could not serve. INVARIANTS states the property this
        # restores: "a pod that starts and then fails queries is one the
        # autoscaler adds replicas around" (D69, D68).
        #
        # A CLOSED SET OF ONE VALUE, NEVER A LIST OF FAILURES TO EXCLUDE. The
        # label set is open — `telemetry::grpc::status_name` maps fifteen gRPC
        # codes, `Drop` adds `UNRECORDED`, and gateway emits `FORBIDDEN`, which is
        # in neither. An exclusion list falls silently back into this defect the
        # day a value nobody listed appears; matching the one value that means
        # "served" cannot. Five charts carry this selector, so it also has to be
        # a thing five separately-edited files can stay in agreement about —
        # the reasoning `telemetry::grpc::status_name` exists for.
        #
        # SHEDDING UNDER OVERLOAD IS NOT COUNTED, AND THAT IS THE INTENT rather
        # than a gap. By the time a saturated pod returns DEADLINE_EXCEEDED its
        # OK rate is already far above the threshold below and the HPA is pinned
        # at maxReplicaCount, so the shed load triggers no scale-up the served
        # rate has not triggered already.
        #
        # AT THE GATEWAY THE SAME REASONING IS SHARPER. D74's limiter refuses by
        # POLICY with RESOURCE_EXHAUSTED rather than because this pod ran out of
        # capacity, so counting a throttled call would spend replicas serving a
        # caller that was deliberately throttled. A flood of UNAUTHENTICATED or
        # FORBIDDEN answers is the same shape: rejecting credentials faster is
        # the limiter's job, not the autoscaler's.
        query: >-
          sum(rate(yadgar_calls_total{service="{{ .Chart.Name }}", outcome="OK"}[2m]))
          / clamp_min(count(up{app="{{ .Chart.Name }}"}), 1)
        threshold: {{ .Values.autoscaling.threshold | quote }}
{{- end }}
