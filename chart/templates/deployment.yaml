{{/*
  WHETHER THIS POD PRESENTS A CLIENT CERTIFICATE AT ALL (ADR-0516).

  Computed ONCE, here, because it is asked four times below — twice for the
  environment, once for the mount, once for the volume. `volumeMounts:` and
  `volumes:` render unconditionally now (step 2a mounts the two ConfigMaps from
  `yadgarhq/config` on every deployment), so a client-certificate mount added
  without widening BOTH the mount and the volume renders one with no volume
  behind it, or a volume no mount names — either half missing is the mistake to
  watch for.

  ONE LEAF, TWO UPSTREAMS, so the per-upstream environment blocks still guard on
  their own `tls.enabled` beside this: a deployment can cut `task` over before
  `iam`. What this value decides is whether the identity exists to be presented.
*/}}
{{- $clientCert := .Values.clientCertificate.secret -}}
{{/*
  WHETHER THE MOUNT IS WORTH MAKING AT ALL.

  A client certificate is presented only INSIDE an encrypted transport, so a pod
  with the Secret named and both upstreams cleartext has nothing to present it
  on. Mounting it anyway would put a PRIVATE KEY in a pod that reads no part of
  it — and it would render a volume no environment variable names, which reads
  as a mistake to anyone diffing the manifest. Both halves are guarded, so the
  reverted state leaves nothing behind.
*/}}
{{- $presentsIdentity := and $clientCert (or .Values.task.tls.enabled .Values.iam.tls.enabled) -}}
{{/*
  WHETHER D73'S BOOTSTRAP TOKEN IS MOUNTED AT ALL (ADR-0492, ledger 638).

  ONE VALUE GATES THREE SITES — the environment variable, the mount and the
  volume — and it is hoisted here for the reason `$presentsIdentity` above is:
  the three sites are far apart in this file, and either half missing is the
  mistake to watch for. Here the two halves fail DIFFERENTLY, and that asymmetry
  is why this is one expression rather than three copies of a condition:

    - THE VARIABLE WITHOUT THE VOLUME IS A CRASHLOOP ON EVERY REPLICA.
      `main.rs`'s `bootstrap_token()` reads YADGAR_ADMIN_BOOTSTRAP_TOKEN_FILE
      and, finding a path it cannot read, EXITS naming it — "a path that cannot
      be read is a configuration that was ATTEMPTED and failed". That is right in
      the binary and catastrophic here, because it takes MCP, /auth/login and
      /auth/enrol down with it over one administrative knob.
    - THE VOLUME WITHOUT THE VARIABLE IS A SILENTLY DISABLED PATH. The Secret is
      mounted, nothing names it, `bootstrap_token()` returns disabled, and every
      request presenting a bootstrap token is answered 503 while the manifest
      shows the credential sitting right there in the pod.

  A SINGLE `$` VARIABLE IS AS CLOSE AS THIS LANGUAGE GETS, and saying so is more
  useful than claiming the pairing is enforced. Helm cannot bind an env entry to
  a volume: they are three list items in three places, so neither unpaired state
  is unrenderable. What the variable buys is that the three sites read ONE
  expression, so turning this on or off is one edit rather than three that can
  disagree. The residual hole is a later edit deleting one of the three blocks,
  and REVIEW is what catches that — nothing in the template can.

  THE HALF THAT IS ENFORCED IS THE KEY. `adminBootstrap.tokenSecretKey` is read
  through `required` inside `items:` below, so naming a Secret and no key fails
  at RENDER time: `helm upgrade` refuses and the pods already running are
  untouched. That is the same shape the four Secret mounts below already have.
*/}}
{{- $bootstrapTokenSecret := .Values.adminBootstrap.tokenSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # OMITTED ENTIRELY WHEN KEDA OWNS THE COUNT, and that guard is the whole point
  # of the condition. KEDA drives a ScaledObject through an HPA, which writes
  # `spec.replicas` on this Deployment; Argo runs with `selfHeal: true` and no
  # `ignoreDifferences` for this field, so a rendered `replicas:` is a value Argo
  # keeps restoring and the autoscaler keeps overwriting. That is not a snap on
  # each upgrade — it is a CONTINUOUS revert loop, in which a scale-up is undone
  # within a sync interval and the load that caused it is served by
  # `replicaCount` pods.
  #
  # Rendering nothing hands the field to the HPA, which is what `minReplicas`
  # exists to floor. `replicaCount` still applies to every deployment that has
  # not enabled autoscaling, which is the chart's own default (D80).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.rollingUpdate }}
  # THE ROLL'S SHAPE, WRITTEN OUT BECAUSE THE DEFAULT IS COUNT-DEPENDENT
  # (ledger 691). Kubernetes defaults both `maxUnavailable` and `maxSurge` to
  # 25%, and it stores the PERCENTAGE rather than a resolved integer: the
  # controller resolves it against the LIVE replica count at every roll,
  # rounding `maxUnavailable` down and `maxSurge` up.
  #
  # AT THIS CHART'S OWN DEFAULT THIS CHANGES NOTHING, and the diff must not be
  # read as if it did. 25% of `replicaCount: 2` is 0.5, which is already 0 down
  # and 1 up. Checked against the live objects rather than assumed: every yadgar
  # Deployment in the reference cluster stores `25%`/`25%` today and therefore
  # already rolls at 0/1.
  #
  # WHAT IT CHANGES IS THAT THE GUARANTEE SURVIVES A COUNT CHANGE. `autoscaling`
  # hands the count to KEDA up to `maxReplicas`, and at 6 that same 25% resolves
  # to `maxUnavailable: 1` — a roll under load then runs a replica short,
  # silently, because nobody ever wrote a number. This is ledger 606's argument
  # about `failureThreshold` applied to the other inherited default in this
  # file: the defect was never the value, it was that `git grep strategy` could
  # not find it.
  #
  # THE SURGE POD IS SCHEDULABLE. It is three pods against two schedulable nodes
  # in the reference cluster — three kind nodes, the control plane carrying
  # `node-role.kubernetes.io/control-plane:NoSchedule` — at a 50m CPU request,
  # and `topologySpreadConstraints` below is `ScheduleAnyway` precisely so that
  # third pod is never the one that stalls the roll.
  #
  # `rollingUpdate: {}` in an operator's values renders nothing here and returns
  # the field to the count-dependent default described above.
  strategy:
    type: RollingUpdate
    rollingUpdate: {{- toYaml . | nindent 6 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # ITS OWN, rather than the namespace's `default` (ledger 511). Every pod
      # gets a ServiceAccount whether or not anybody names one, so the choice is
      # never "an identity or none" — it is "an identity this workload owns, or
      # the one every unnamed workload in the namespace shares". A shared identity
      # cannot be granted a permission without granting it to all of them.
      serviceAccountName: {{ .Chart.Name }}
      # NO KUBERNETES API TOKEN IN THE POD. `gateway` never calls the API server:
      # it serves MCP over HTTP and dials `task` and `iam` over gRPC. Mounting a
      # token it does not use hands a credential to anything that reaches the
      # filesystem — including the audience-bound token an SSRF can be pointed at.
      # Set here as well as on the ServiceAccount because the pod spec wins, and
      # the pod spec is what a reader of this file sees.
      automountServiceAccountToken: false
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.terminationGracePeriodSeconds }}
      # 35 = 5 + 25 + 5, AND EVERY TERM IS SOMEBODY ELSE'S NUMBER (ledger 690).
      # This is ONE budget covering BOTH halves of a pod's death, which is what
      # makes the arithmetic non-obvious: kubelet runs the `preStop` handler
      # first and sends SIGTERM only afterwards, and the clock does not restart
      # in between. So this must cover the sleep below PLUS the drain after it.
      #
      #    5  the `preStop` sleep on the container below.
      #   25  `yadgar_lifecycle::DRAIN_BUDGET` (lifecycle/src/drain.rs) — the
      #       longest `drain_within` lets the serving future run once shutdown
      #       has been asked for. A constant, deliberately, and not a number
      #       this chart is allowed to set.
      #    5  the slack that same constant's docstring reserves "to log and
      #       exit".
      #
      # WHY NOT LEAVE IT AT THE INHERITED 30. 30 was exactly enough while nothing
      # ran before SIGTERM: 30 - 25 is that 5s of slack and not one second more.
      # A 5s `preStop` spends the whole of it and leaves a 25s budget inside a
      # 25s window, so the first drain that actually used its budget would meet
      # SIGKILL at the instant it overran — the one outcome `DRAIN_BUDGET`
      # exists to make unreachable. Adding the hook without moving this number
      # would have been strictly worse than adding neither.
      #
      # THE RELATIONSHIP IS NOW ASSERTABLE, WHICH IT WAS NOT. `DRAIN_BUDGET`'s
      # docstring says "no chart in this estate sets or exposes it, so there is
      # no rendered value to assert against and the relationship is stated here
      # rather than faked as a test". This line is that rendered value. The rule
      # that docstring states still holds and points the other way: "a
      # deployment that lowers the grace period below 30s must lower this with
      # it" — 35 does not lower it.
      #
      # `0` RENDERS NOTHING rather than rendering `0`, and the asymmetry is
      # deliberate: a literal 0 is an immediate SIGKILL with no drain at all.
      # Set 0 to return the field to kubelet's 30s default. There is no way to
      # spell "kill instantly" through this chart.
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      # HOSTNAME IS THE ONLY AXIS THERE IS, AND `ScheduleAnyway` IS THE ONLY SAFE
      # STRENGTH (ledger 691). Measured on the reference cluster rather than
      # assumed: three kind nodes, not one of them carrying a
      # `topology.kubernetes.io/zone` or `/region` label, and the control plane
      # tainted `node-role.kubernetes.io/control-plane:NoSchedule` — two
      # schedulable nodes for two replicas.
      #
      # `DoNotSchedule` WOULD HANG EVERY ROLL, and that is the whole reason this
      # says otherwise. `maxSurge: 1` puts three pods on those two nodes for the
      # length of a roll, which is a skew of 2 against `maxSkew: 1`; a required
      # constraint leaves the surge pod Pending, and with `maxUnavailable: 0` the
      # rollout then neither proceeds nor fails. It hangs, with no error — D68's
      # failure mode wearing a different field's name.
      #
      # THE SELECTOR IS THIS TEMPLATE'S, NEVER THE OPERATOR'S, which is why only
      # the three scalars live in `values.yaml`. It is `app: {{ .Chart.Name }}`
      # — the label this Deployment actually sets, and the one the
      # PodDisruptionBudget already selects on. A `labelSelector` that matches no
      # pod is a field that does nothing for the rest of the chart's life, and
      # neither `helm template` nor `helm lint --strict` will say a word about
      # it.
      #
      # NO `affinity` BESIDE THIS, DELIBERATELY. A preferred `podAntiAffinity` on
      # the same label and the same topology key is this same control spelled a
      # second way, and two knobs for one decision is how they come to disagree.
      # Ledger 691's `affinity` is declined rather than added.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ .Chart.Name }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # LISTEN and METRICS_LISTEN are stated explicitly here, unlike
            # task/task-db's chart, where they are left to the binary's own
            # defaults because those defaults already match. gateway is the one
            # service every client address ends up at, so its ports are made
            # visible in the chart rather than left implicit in code someone
            # would have to go read.
            - name: LISTEN
              value: "0.0.0.0:8080"
            - name: METRICS_LISTEN
              value: "0.0.0.0:9090"
            - name: TASK_HOST
              value: {{ .Values.task.host | quote }}
            - name: TASK_PORT
              value: {{ .Values.task.port | quote }}
            {{- if .Values.task.tls.enabled }}
            # RENDERED ONLY WHEN TLS IS ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and takes the cleartext
            # path it always took. The same shape as
            # YADGAR_TRUST_UNAUTHENTICATED_HEADERS below: absence is the
            # default, and the flag is the whole of the lever.
            - name: TASK_TLS_ENABLED
              value: "1"
            # A PATH, never an issuer-specific resource (D80). cert-manager
            # writes this file in the reference deployment and a hand-assembled
            # Secret writes it anywhere else; neither the chart nor the binary
            # can tell the difference, which is the point.
            - name: TASK_TLS_CA_FILE
              value: /var/run/config/task-ca/ca.pem
            {{- if $clientCert }}
            # WHO THIS GATEWAY SAYS IT IS ON THAT HOP — mutual TLS (ADR-0516).
            #
            # THE SAME TWO PATHS FOR BOTH UPSTREAMS, because there is ONE client
            # leaf: `gateway-client-tls` is this process's identity rather than a
            # property of a hop. One volume below, two prefixes here.
            #
            # RENDERED PER UPSTREAM, so a deployment can cut one hop over before
            # the other: this pair appears only when THAT upstream's TLS is on
            # AND `clientCertificate.secret` is named. Both are off by default,
            # so turning an upstream's transport on encrypts the hop and presents
            # no identity, exactly as before.
            #
            # PATHS, never an issuer-specific resource (D80).
            - name: TASK_TLS_CLIENT_CERT_FILE
              value: /var/run/secrets/client-cert/client.crt
            - name: TASK_TLS_CLIENT_KEY_FILE
              value: /var/run/secrets/client-cert/client.key
            {{- end }}
            {{- if .Values.task.tls.domain }}
            # Only when the certificate names something other than the Service.
            # Unset means "verify against task.host", which is what makes a
            # certificate issued for the Service name work while the balancer
            # dials pod addresses.
            - name: TASK_TLS_DOMAIN
              value: {{ .Values.task.tls.domain | quote }}
            {{- end }}
            {{- end }}
            # The whole credential lifecycle: where POST /auth/login and POST
            # /auth/enrol are sent (D75, D73), AND where attestation resolves a
            # bearer token on every tools/call (ADR-0488). The pair matches
            # TASK_HOST / TASK_PORT deliberately. There is no second variable for
            # the identity half any more — YADGAR_IAM_ADDR reserved it while it was
            # unimplemented, and is deleted. See values.yaml.
            - name: IAM_HOST
              value: {{ .Values.iam.host | quote }}
            - name: IAM_PORT
              value: {{ .Values.iam.port | quote }}
            {{- if .Values.iam.tls.enabled }}
            # The hop the BEARER TOKEN itself goes down. Rendered only when TLS
            # is asked for, and configured independently of task's above so the
            # two can be cut over one at a time.
            - name: IAM_TLS_ENABLED
              value: "1"
            # A PATH, never an issuer-specific resource (D80). This channel
            # goes through yadgar-dial, exactly as task's does, so this bundle is
            # read once — by that crate, before it resolves anything — rather
            # than by a second copy here; see `upstream::connect_iam`.
            - name: IAM_TLS_CA_FILE
              value: /var/run/config/iam-ca/ca.pem
            {{- if $clientCert }}
            # WHO THIS GATEWAY SAYS IT IS ON THAT HOP — mutual TLS (ADR-0516).
            #
            # The same two paths the `task` block above names, and deliberately:
            # one leaf, one mount, two upstreams.
            #
            # RENDERED PER UPSTREAM, so a deployment can cut one hop over before
            # the other: this pair appears only when THAT upstream's TLS is on
            # AND `clientCertificate.secret` is named. Both are off by default,
            # so turning an upstream's transport on encrypts the hop and presents
            # no identity, exactly as before.
            #
            # PATHS, never an issuer-specific resource (D80).
            - name: IAM_TLS_CLIENT_CERT_FILE
              value: /var/run/secrets/client-cert/client.crt
            - name: IAM_TLS_CLIENT_KEY_FILE
              value: /var/run/secrets/client-cert/client.key
            {{- end }}
            {{- if .Values.iam.tls.domain }}
            # Only when the certificate names something other than the Service.
            - name: IAM_TLS_DOMAIN
              value: {{ .Values.iam.tls.domain | quote }}
            {{- end }}
            {{- end }}
            # D72. How long one resolved credential is reused before iam is asked
            # again. SET UNCONDITIONALLY rather than only when it differs from the
            # binary's default: it is the backstop for a missed invalidation event
            # and the whole bound whenever the broker below is unreachable, and a
            # security bound that is present in the manifest can be read off the
            # running pod. Set it to 0 to disable the cache and go back to a round
            # trip per call. See values.yaml.
            - name: YADGAR_CREDENTIAL_TTL_SECONDS
              value: {{ .Values.credentialCache.ttlSeconds | quote }}
            # The broker carrying that invalidation (D22, D72). Absent, unreachable
            # or REFUSING is survivable and loudly logged at every boot: gateway is
            # the only ingress, so a boot gate here would turn a broker outage into
            # a total outage of every MCP call, and the TTL above is the backstop
            # for exactly that window.
            #
            # SET BY DEFAULT, so the consumer runs. It is read BEFORE the
            # credential below, so CLEARING it is the revert and turns the whole
            # block off — the two variables that follow go inert rather than
            # needing to be cleared themselves.
            #
            # It could not have shipped set before the broker had an account for
            # this service: a NATS server with an authorization block REFUSES a
            # credential-less CONNECT rather than accepting it unauthenticated.
            # See values.yaml.
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- if .Values.nats.passwordSecret }}
            # RENDERED ONLY WHEN THE BROKER ASKS FOR A CREDENTIAL, so an adopter
            # whose broker declares no authorization block clears
            # `nats.passwordSecret` and this whole block disappears. The reference
            # deployment's Secret IS the default, because that broker demands a
            # credential.
            #
            # **WITH `nats.url` SET, THE SECRET IS A HARD PREREQUISITE.** These two
            # variables are inert only while the url is empty, because the binary
            # reads the url first and stops there. With it set, a
            # `nats.passwordSecret` naming a Secret that does not exist mounts an
            # empty directory and the pod EXITS at boot naming the path below.
            # That is the designed failure — loud, and never a silent connection
            # without the credential it was told to present — but it is a boot
            # failure, not a degraded start.
            #
            # BOTH, OR NEITHER. The broker's authorization block names an account
            # and a password together, so gateway refuses to start with either one
            # alone, in BOTH directions. Which makes the `if` load-bearing rather
            # than tidy: it renders this variable and the password path TOGETHER,
            # so an adopter who clears `nats.passwordSecret` drops both and boots
            # with no credential — the supported state — even though `nats.user`
            # still carries its default.
            #
            # `required` here rather than a bare lookup: an override that nulled
            # the user would otherwise render an empty string, and the failure
            # would be a CrashLoop three layers from its cause.
            - name: NATS_USER
              value: {{ required "nats.user names the broker account gateway authenticates as and must be set whenever nats.passwordSecret is; see the chart's values.yaml" .Values.nats.user | quote }}
            # A PATH, never the value (D80). A password in the environment is a
            # password in `kubectl describe pod`; a file is readable only inside
            # the container.
            #
            # THERE IS NO SILENT MIDDLE STATE. A path that names no readable,
            # non-empty file fails the pod at boot naming the path — gateway never
            # falls back to a broker connection carrying no credential. A broker
            # that REFUSES this gateway — a wrong password, or no password against
            # a broker that demands one — is survivable and logged as a deployment
            # error rather than as an outage, and backed off harder than an
            # outage is.
            - name: NATS_PASSWORD_FILE
              value: /var/run/secrets/nats/password
            {{- end }}
            # D74. The ADDRESS is required and gateway exits without it: a
            # gateway with nowhere to keep its buckets enforces no capacity
            # limit at all, and that is a deployment mistake rather than an
            # outage, so D69's fail-at-boot rule applies. An unreachable Valkey
            # at RUNTIME is the other case, and there the call proceeds.
            - name: YADGAR_VALKEY_ADDR
              value: {{ .Values.rateLimit.addr | quote }}
            - name: YADGAR_RATE_LIMITS
              value: {{ .Values.rateLimit.limits | quote }}
            - name: YADGAR_RATE_LIMIT_DEFAULT
              value: {{ .Values.rateLimit.default | quote }}
            - name: YADGAR_RATE_LIMIT_TIMEOUT_MS
              value: {{ .Values.rateLimit.timeoutMs | quote }}
            {{- if .Values.rateLimit.passwordSecret }}
            # RENDERED ONLY WHEN THE CACHE ASKS FOR A PASSWORD, so a deployment
            # that has not cut over sends the binary nothing at all and dials the
            # cache exactly as it always did. The same shape as `task.tls` above:
            # absence is the default and the Secret is the whole of the lever.
            #
            # A PATH, never the value (D80). A password in the environment is a
            # password in `kubectl describe pod`; a file is readable only inside
            # the container.
            #
            # THERE IS NO SILENT MIDDLE STATE. A path that names no readable,
            # non-empty file fails the pod at boot naming the path — gateway never
            # falls back to an unauthenticated connection. If the cache demands a
            # password this pod cannot produce, the first call is REFUSED with a
            # 503 rather than proceeding on the degraded floor an unreachable
            # cache gets; see `limit::Decision::Unauthenticated`.
            - name: YADGAR_VALKEY_PASSWORD_FILE
              value: /var/run/secrets/valkey/password
            {{- end }}
            # The DIVISOR of the degraded-mode floor, and required for the same
            # reason the address is. While Valkey cannot answer, each replica
            # holds callers to rate/this on its own; the aggregate bound that
            # makes that acceptable holds only if this is the real ceiling. Taken
            # from the autoscaler's own maximum when it is enabled, and from the
            # fixed replica count when it is not — a constant in the binary and a
            # number here would be two places that must agree, and only one of
            # them gets edited.
            - name: YADGAR_MAX_REPLICAS
              value: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.maxReplicas | quote }}{{ else }}{{ .Values.replicaCount | quote }}{{ end }}
            # HOW MANY PROXIES STAND IN FRONT (ADR-0491, D80). ALWAYS RENDERED,
            # even when empty — unlike the optional Secrets above, and for the
            # opposite reason. An empty value is a real instruction here: it says
            # nobody knows, and gateway then records no source address at all and
            # bounds the credential endpoints per observed hop. Rendering it
            # unconditionally means `kubectl describe pod` answers the question
            # "does this deployment attribute addresses?" without anyone having to
            # know which branch of a template ran.
            - name: YADGAR_TRUSTED_PROXY_HOPS
              value: {{ .Values.sourceAddress.trustedProxyHops | quote }}
            # WHICH BROWSER ORIGINS MAY CALL THIS GATEWAY, and ALWAYS RENDERED
            # even when empty — the same shape as YADGAR_TRUSTED_PROXY_HOPS above
            # and for the same reason. An empty value is a real instruction: no
            # browser origin is allowed, which is the correct closed posture for a
            # server whose clients are agents.
            #
            # It became REQUIRED in the binary with ADR-0569, so this line is what
            # keeps the pod booting. Before it, an absent variable and a
            # deliberately-closed policy were the same observable state and the
            # compiled-in "" was the only source.
            - name: YADGAR_ALLOWED_ORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
            # The two buckets bounding /auth/login and /auth/enrol (ledger 497).
            # SEPARATE FROM YADGAR_RATE_LIMITS above, because D74's buckets key on
            # a user and a login has none yet — see values.yaml.
            - name: YADGAR_LOGIN_RATE_LIMIT
              value: {{ .Values.credentialLimits.attributed | quote }}
            - name: YADGAR_LOGIN_UNATTRIBUTED_RATE_LIMIT
              value: {{ .Values.credentialLimits.unattributed | quote }}
            # The two buckets bounding the /admin surface (ADR-0492, ledger 638).
            # A THIRD AND FOURTH BUCKET rather than a share of the two above:
            # sharing them would make an administrator's ordinary work consume a
            # budget sized for password attempts, and would make a
            # bootstrap-token brute force spend a bucket an operator reads as
            # login pressure. See values.yaml.
            #
            # REQUIRED IN THE BINARY (ADR-0569), so these two lines are what keep
            # the pod booting — the repository's own `no-compiled-in-defaults`
            # gate refuses a reader that accepts a fallback, so there is nowhere
            # for an unset value to land.
            - name: YADGAR_ADMIN_RATE_LIMIT
              value: {{ .Values.adminLimits.attributed | quote }}
            - name: YADGAR_ADMIN_UNATTRIBUTED_RATE_LIMIT
              value: {{ .Values.adminLimits.unattributed | quote }}
            {{- if $bootstrapTokenSecret }}
            # D73'S BOOTSTRAP TOKEN — the credential that lets the FIRST
            # administrator exist before an administrator exists to create one
            # (ADR-0492, ledger 638). It reaches creating an administrator,
            # promoting one, and — under ADR-0655's zero-credential predicate,
            # as amended by ADR-0656 and enforced inside iam-db's write, never
            # at this gateway — issuing an enrolment.
            #
            # RENDERED ONLY WITH THE MOUNT, and the two are one expression at the
            # top of this file precisely because the unpaired states are the
            # hazard — see the comment there. Absent, `bootstrap_token()` returns
            # DISABLED, the process serves everything else, and each request
            # presenting a bootstrap token is answered 503 naming the missing
            # configuration. That is a supported posture rather than a fault.
            #
            # NOT REQUIRED IN THE BINARY, and it is the only knob here that is
            # not. `main.rs` marks the read `ADR-0569-EXCEPTION` because absence
            # is a state the design needs — ADR-0569's own revisit trigger, "a
            # knob whose absence leaves the system correct". Every other variable
            # above reads through `env_required` and fails the boot without one.
            #
            # A PATH, never the value (D80). A token in the environment is a token
            # in `kubectl describe pod`; a file is readable only inside the
            # container.
            #
            # THERE IS NO SILENT MIDDLE STATE ONCE IT IS SET. A path naming no
            # readable file fails the pod at boot naming the path — `NOT
            # CONFIGURED` and `CONFIGURED WITH A BROKEN PATH` are different
            # states and only the first serves. So do not set
            # adminBootstrap.tokenSecret against a cluster where that Secret does
            # not exist; clear the value instead. See values.yaml.
            - name: YADGAR_ADMIN_BOOTSTRAP_TOKEN_FILE
              value: /var/run/secrets/admin-bootstrap/token
            {{- end }}
            - name: RUST_LOG
              value: "info"
            {{- if .Values.trustUnauthenticatedHeaders }}
            # DEVELOPMENT ONLY (see the comment on this value in values.yaml).
            # An explicit OPT-OUT: setting it trusts the identity the caller
            # attaches to its own request, verified by nothing. Absent, gateway
            # resolves the request's bearer token through iam.ResolveCredential,
            # which is the binary's default and needs no variable at all.
            - name: YADGAR_TRUST_UNAUTHENTICATED_HEADERS
              value: "1"
            {{- end }}
          # This service does NOT wait for task before listening, for the same
          # reason task does not wait for task-db: a downstream that is not yet
          # ready has no endpoint to dial, and blocking startup on it would turn
          # one module's slow boot into a cascading outage at the one place all
          # traffic already passes through. A call that cannot reach `task` fails
          # per-request, which is recoverable; refusing to start is not.
          {{- with .Values.preStopSleepSeconds }}
          # THE SLEEP IS FOR THE WITHDRAWAL, NOT FOR THE DRAIN (ledger 690).
          # Deleting a pod fans out to two consumers that do not wait for each
          # other: kubelet, which begins killing the container, and the
          # EndpointSlice controller, whose removal then has to reach everything
          # that routes here. Nothing orders those two. With no `preStop`,
          # SIGTERM can win, and the drain below — which is careful, bounded and
          # correct — then drains a listener that callers are still being sent
          # to. What is lost is every request dispatched INTO that window, and no
          # amount of drain budget helps with those: they arrive after the
          # decision to stop and before anyone was told.
          #
          # THE PATH HERE IS KUBE-PROXY'S. This Service has a virtual IP, so the
          # removal lands as a dataplane rule change on every node within about
          # a second of the EndpointSlice write — the shortest form this race
          # takes anywhere in the estate, and 5s is comfortably clear of it.
          #
          # THIS IS NOT WHAT THE READINESS PROBE COVERS, and the probe's own
          # stanza below says so: a pod being ROLLED never pays the probe window,
          # because the EndpointSlice controller drops a pod carrying a
          # `deletionTimestamp` with no probe involved. That probe governs the
          # self-initiated rotation drain of ADR-0523, where there is no
          # `deletionTimestamp` for anything to see. This governs the deletion
          # path. The two do not overlap, and neither substitutes for the other.
          #
          # `sleep`, NOT AN `exec` OF /bin/sleep — AND THE IMAGE LEAVES NO
          # CHOICE. `Containerfile` ships this binary on
          # `ghcr.io/yadgarhq/runtime`, which is distroless/static (D63): no
          # shell, no `sleep` binary. An `exec` handler would fail, kubelet would
          # log the failure and proceed straight to SIGTERM, and this chart would
          # look hardened while doing nothing whatsoever. The `sleep` action is
          # the API server's own and needs neither shell nor binary. It wants a
          # control plane at v1.30 or newer; verified present on the reference
          # cluster's v1.36 with `kubectl explain
          # pod.spec.containers.lifecycle.preStop.sleep`, and an older control
          # plane would drop the field rather than refuse it.
          #
          # 5s IS PAID ON EVERY POD DEATH, which is the cost worth naming rather
          # than burying. It lengthens a rolling update by 5s per batch and a
          # node drain by 5s per pod, and it is spent INSIDE
          # `terminationGracePeriodSeconds` above rather than added to it. `0`
          # renders no `lifecycle` block at all.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            # WITHDRAWAL IS `failureThreshold` x `periodSeconds`, AND BOTH ARE
            # WRITTEN HERE (ledger 606). Only `periodSeconds` was ever spelled;
            # `failureThreshold` was kubelet's inherited 3, so the 15s this pod
            # stayed in the Service after it stopped listening was a number
            # nobody chose and `git grep failureThreshold` could not find. 2 x 2
            # makes it 4s, and makes it findable.
            #
            # THE CASE THIS COSTS IS NARROW, and naming it is what keeps the
            # numbers honest. A pod being ROLLED does not pay it: the
            # EndpointSlice controller drops a pod carrying a `deletionTimestamp`
            # from the ready set at deletion, with no probe involved. A CRASHED
            # container does not pay it either: kubelet reports a container that
            # is not running as not ready on the next status sync, ahead of the
            # prober. What pays it is a process that is ALIVE and has stopped
            # listening, which is the self-initiated rotation drain of ADR-0523
            # exactly: `rotate` ends the serve, the listener closes, and the
            # process stays up for up to `DRAIN_BUDGET` with no
            # `deletionTimestamp` for either fast path to see. In that window
            # this probe is the ONLY thing that withdraws this pod.
            #
            # `timeoutSeconds` IS SPELLED BECAUSE `periodSeconds` DEPENDS ON IT.
            # A prober worker ticks once per period and a probe may run for the
            # whole timeout, so the product above is the real window only while
            # the timeout is the smaller number. Raising `timeoutSeconds` past
            # `periodSeconds` stretches the withdrawal silently, and that is the
            # defect this stanza exists to stop repeating.
            #
            # WHY NOT TIGHTER, AND WHY NOT LOOSER. `failureThreshold: 1` lets one
            # dropped SYN withdraw a healthy pod, and against `replicaCount: 2`
            # that is half this service for the length of a transient. Note it
            # would be a WITHDRAWAL, not an eviction: a PodDisruptionBudget
            # governs the Eviction API and cannot act on a readiness-driven
            # EndpointSlice change, so it is no backstop here.
            #
            # KEEPING 3 WAS THE REAL ALTERNATIVE and it is not free either. At
            # `periodSeconds: 2` a threshold of 3 gives 6s — nine of the eleven
            # seconds cut, while keeping the whole inherited transient budget.
            # Dropping to 2 spends a third of that budget for the last 2s. It is
            # taken because no chart here sets `affinity`, `topologySpread` or a
            # `strategy`, so both replicas can co-locate and any node-local fault
            # is already a whole-service fault; what 3 buys back is roughly 3s of
            # recovery tail after the fault clears, against 11s off every
            # rotation drain. `periodSeconds: 1`
            # buys the same 4s at threshold 4, but it puts the period ON the
            # timeout, so the arithmetic stops holding the moment a probe has to
            # wait rather than being refused. There is no boot cost either way:
            # failing readiness never kills a pod, and THIS SERVICE OWNS NO
            # ENGINE — it reports Ready as soon as it is listening, and boot to
            # listening is sub-second, so the pre-listen failures are a fraction
            # of one period. D69's probe-migrate-listen gate is NOT in front of
            # this port; it lives in the `-db` services, and an earlier revision
            # of this comment claimed it here.
            #
            # WHAT THIS DOES NOT FIX: a wedged process that keeps its socket open
            # answers a `tcpSocket` probe at every threshold. The root fix for
            # the drain window is the process reporting not-ready BEFORE it
            # closes the listener; this is chart-side mitigation for a
            # binary-side gap, and it is filed as such.
            #
            # THIS SERVICE HAS A VIRTUAL IP in front of it, so the withdrawal is
            # kube-proxy's and lands within about a second of the EndpointSlice
            # write. The probe window above is the whole of the delay here.
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # THE CONFIGURATION REPOSITORY'S TWO CONFIGMAPS (ADR-0569, ADR-0570,
            # step 2a): the knobs every service reads, and this service's own —
            # empty today, mounted anyway so it is ready the day it is not.
            #
            # DIRECTORIES, NEVER `subPath`. A subPath mount is copied once at
            # container start and kubelet never updates it, so the file would be
            # frozen for the life of the pod while the ConfigMap moved underneath
            # it — the rotation watcher would see nothing and an edited knob
            # would silently never take effect.
            #
            # NO `optional: true`, unlike every Secret mount below. The default,
            # `false`, is what makes kubelet refuse to start this pod at all
            # while `shared` or `gateway` is absent — `ContainerCreating` naming
            # the missing ConfigMap — rather than starting it with an empty
            # directory the binary would then refuse to read from anyway
            # (ScheduleError::Absent).
            #
            # **`gateway` IS MOUNTED, AND TODAY IT IS NEITHER READ NOR WATCHED.**
            # `yadgar-lifecycle`'s `Configuration::under(root)` yields exactly one
            # path, `root/shared/shared.yaml`; the crate has no API for a
            # per-service document, so `config-gateway` is in no process's
            # ADR-0523 watch set. Two things follow and both are deliberate. The
            # `optional: false` reasoning above is true of `shared` and NOT of
            # this one — an absent `gateway` ConfigMap blocks the pod for no
            # functional benefit, which is accepted so that both mounts are
            # governed by one rule rather than two. And the day this file gains
            # its first knob, Argo will sync it and kubelet will swap it and NO
            # POD WILL RESTART, so the new value never takes effect and nothing
            # reports that — the exact failure ADR-0570 names for `envFrom`,
            # reproduced through a file mount. THE MOUNT IS READY; JOINING THIS
            # DOCUMENT TO THE WATCH SET IS A FURTHER CHANGE, and it belongs in
            # the same pull request as the first gateway-only knob.
            - name: config-shared
              mountPath: /etc/yadgar/config/shared
              readOnly: true
            - name: config-gateway
              mountPath: /etc/yadgar/config/gateway
              readOnly: true
            {{- if .Values.rateLimit.passwordSecret }}
            # A DIRECTORY MOUNT, never subPath — the same rule the CA mounts
            # below state. A subPath mount is a one-time copy kubelet never
            # refreshes, so a rotated cache password would never reach this
            # process and the pod would keep presenting the old one.
            - name: valkey-password
              mountPath: /var/run/secrets/valkey
              readOnly: true
            {{- end }}
            {{- if .Values.nats.passwordSecret }}
            # A DIRECTORY MOUNT, never subPath — same rule as the cache password
            # above. A subPath mount is a one-time copy kubelet never refreshes, so
            # a rotated broker password would never reach this process and it would
            # keep presenting the old one.
            - name: nats-password
              mountPath: /var/run/secrets/nats
              readOnly: true
            {{- end }}
            {{- if .Values.task.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath. A subPath mount is a one-time
            # copy that kubelet never refreshes, so the bundle would freeze at
            # whatever it was when the pod started and a rotated authority would
            # never reach this process.
            - name: task-ca
              mountPath: /var/run/config/task-ca
              readOnly: true
            {{- end }}
            {{- if .Values.iam.tls.enabled }}
            # SEPARATE FROM task's, and not a shared bundle. The two upstreams
            # may be issued by different authorities, and one that trusts both
            # would make each hop's trust depend on the other's rotation.
            - name: iam-ca
              mountPath: /var/run/config/iam-ca
              readOnly: true
            {{- end }}
            {{- if $presentsIdentity }}
            # A DIRECTORY MOUNT, never subPath — and here the rule is at its most
            # expensive to break. A subPath mount is a one-time copy kubelet
            # never refreshes, so a renewed CLIENT certificate would never reach
            # this process; ADR-0516 makes that an expired leaf that STOPS the
            # hop to `iam` or `task` rather than one that merely weakens it. The
            # rotation watcher only works because this is a directory.
            #
            # ONE MOUNT FOR BOTH UPSTREAMS. Both prefixes' variables above name
            # these same two files.
            - name: client-cert
              mountPath: /var/run/secrets/client-cert
              readOnly: true
            {{- end }}
            {{- if $bootstrapTokenSecret }}
            # A DIRECTORY MOUNT, never subPath — the same rule the two password
            # mounts above state, and here it is what makes a ROTATION reach this
            # process at all. A subPath mount is a one-time copy kubelet never
            # refreshes.
            #
            # THE TOKEN IS HELD AS A DIGEST FOR THE LIFE OF THE PROCESS, so a
            # Secret replaced underneath a running pod would leave this gateway
            # comparing against the value it booted with, and no existence check
            # tells the two apart — the Secret's own manifest warns that a cluster
            # rebuild mints a DIFFERENT token while the old one still looks valid
            # in an operator's notes. `main.rs` marks the read
            # `ADR-0523-WATCHED: bootstrap_token` and folds this path into the
            # watch set, so a rotation ENDS the pod and the replacement boots on
            # the new value. That only works because this is a directory.
            - name: admin-bootstrap-token
              mountPath: /var/run/secrets/admin-bootstrap
              readOnly: true
            {{- end }}
      volumes:
        # The two ConfigMaps `yadgarhq/config` renders, same reasoning as the
        # mounts above: unconditional, a directory each, never optional.
        - name: config-shared
          configMap:
            name: shared
        - name: config-gateway
          configMap:
            name: gateway
        {{- if .Values.rateLimit.passwordSecret }}
        - name: valkey-password
          secret:
            secretName: {{ .Values.rateLimit.passwordSecret }}
            # OPTIONAL, and it means what it means on the CA mounts below: the
            # process MUST NOT START without the password, and optional is simply
            # which error says so. A required mount that cannot be satisfied
            # leaves the pod in ContainerCreating with a FailedMount event about a
            # volume. An optional one mounts an empty directory, the binary finds
            # no file at YADGAR_VALKEY_PASSWORD_FILE, and it exits naming THAT
            # PATH. Neither starts; only one of them explains itself. There is no
            # third outcome in which this pod dials the cache without a password
            # it was told to present.
            optional: true
            # ONE KEY, renamed to the `password` the environment names above, so
            # whatever the Secret's author called it does not have to travel into
            # the binary's configuration.
            items:
              - key: {{ required "rateLimit.passwordSecretKey names the key inside rateLimit.passwordSecret that holds the cache password and must be set whenever rateLimit.passwordSecret is; see the chart's values.yaml" .Values.rateLimit.passwordSecretKey | quote }}
                path: password
        {{- end }}
        {{- if .Values.nats.passwordSecret }}
        - name: nats-password
          secret:
            secretName: {{ .Values.nats.passwordSecret }}
            # OPTIONAL, and it means what it means on the cache password above:
            # the process MUST NOT START without the password, and optional is
            # simply which error says so. An optional mount produces an empty
            # directory, the binary finds no file at NATS_PASSWORD_FILE, and it
            # exits naming THAT PATH rather than leaving the pod in
            # ContainerCreating with a FailedMount event about a volume. There is
            # no third outcome in which this pod connects to the broker without a
            # credential it was told to present.
            optional: true
            # ONE KEY, renamed to the `password` the environment names above, so
            # whatever the Secret's author called it does not have to travel into
            # the binary's configuration.
            items:
              - key: {{ required "nats.passwordSecretKey names the key inside nats.passwordSecret that holds the broker password and must be set whenever nats.passwordSecret is; see the chart's values.yaml" .Values.nats.passwordSecretKey | quote }}
                path: password
        {{- end }}
        {{- if .Values.task.tls.enabled }}
        - name: task-ca
          secret:
            secretName: {{ required "task.tls.caSecret holds the CA bundle task is verified against and must be set whenever task.tls.enabled is; see the chart's values.yaml" .Values.task.tls.caSecret }}
            # OPTIONAL, and that is not laxity — it is which error the operator
            # gets. A required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume. An
            # optional one mounts an empty directory, the binary finds no file
            # at TASK_TLS_CA_FILE, and it exits at boot naming THAT PATH and
            # saying that TLS was asked for so cleartext is not the answer.
            # Neither starts; only one of them explains itself. There is no
            # third outcome in which this pod serves traffic over an
            # unencrypted connection it was told to encrypt.
            optional: true
            # ONE KEY, not the whole Secret. A certificate Secret also holds a
            # PRIVATE KEY, and the gateway has no business being able to read
            # task's. Selecting a single key is what keeps it out of the pod,
            # and it is also what renames whatever the issuer called it to the
            # `ca.pem` that TASK_TLS_CA_FILE names.
            items:
              - key: {{ required "task.tls.caSecretKey names the key inside task.tls.caSecret that holds the CA bundle and must be set whenever task.tls.enabled is; see the chart's values.yaml" .Values.task.tls.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if $presentsIdentity }}
        - name: client-cert
          secret:
            secretName: {{ .Values.clientCertificate.secret }}
            # OPTIONAL, and it means what it means on the CA mounts either side:
            # the process MUST NOT START without a usable identity once one has
            # been asked for, and optional is simply which error says so. A
            # required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume; an
            # optional one mounts an empty directory, the binary finds no file at
            # the path it was given, and `connect_iam` or
            # `yadgar_dial::connect_tls` refuses naming THAT PATH. Neither
            # starts; only one of them explains itself. There is no third outcome
            # in which this pod dials an upstream without the identity it was
            # told to present.
            optional: true
            # BOTH KEYS, because a certificate cannot be presented without the
            # key that proves it — the one mount in this file meant to carry a
            # private key, and it is this pod's own. The CA mounts select a
            # single key precisely to keep somebody else's out.
            items:
              - key: {{ required "clientCertificate.certSecretKey names the key inside clientCertificate.secret that holds the client certificate and must be set whenever clientCertificate.secret is; see the chart's values.yaml" .Values.clientCertificate.certSecretKey | quote }}
                path: client.crt
              - key: {{ required "clientCertificate.keySecretKey names the key inside clientCertificate.secret that holds the client private key and must be set whenever clientCertificate.secret is; see the chart's values.yaml" .Values.clientCertificate.keySecretKey | quote }}
                path: client.key
        {{- end }}
        {{- if .Values.iam.tls.enabled }}
        - name: iam-ca
          secret:
            secretName: {{ required "iam.tls.caSecret holds the CA bundle iam is verified against and must be set whenever iam.tls.enabled is; see the chart's values.yaml" .Values.iam.tls.caSecret }}
            # Optional and single-key for the same two reasons as task's above.
            optional: true
            items:
              - key: {{ required "iam.tls.caSecretKey names the key inside iam.tls.caSecret that holds the CA bundle and must be set whenever iam.tls.enabled is; see the chart's values.yaml" .Values.iam.tls.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if $bootstrapTokenSecret }}
        - name: admin-bootstrap-token
          secret:
            secretName: {{ $bootstrapTokenSecret | quote }}
            # OPTIONAL, and it means here exactly what it means on the two
            # passwords above: which ERROR the operator gets, never whether the
            # pod may run without the credential. A required mount that cannot be
            # satisfied leaves the pod in ContainerCreating with a FailedMount
            # event about a volume. An optional one mounts an empty directory, the
            # binary finds no file at YADGAR_ADMIN_BOOTSTRAP_TOKEN_FILE, and it
            # EXITS naming that path. Neither starts; only one of them explains
            # itself.
            #
            # AND THAT EXIT IS THE POINT RATHER THAN A REGRETTABLE SIDE EFFECT.
            # The binary distinguishes "not configured" from "configured and
            # broken": the first disables one path and serves, the second refuses
            # the boot. A Secret this chart was told to mount and cannot find is
            # the SECOND. The way to ask for the first is to clear
            # adminBootstrap.tokenSecret, which removes the variable and the mount
            # together.
            optional: true
            # ONE KEY, renamed to the `token` the environment names above, so
            # whatever the Secret's author called it does not travel into the
            # binary's configuration. `yadgarhq/deploy` calls it `token`.
            #
            # `required` HERE IS THE ONE HALF OF THE PAIRING THE TEMPLATE CAN
            # ENFORCE: a Secret named with no key fails at render, so
            # `helm upgrade` refuses before anything is applied and the running
            # pods are untouched.
            items:
              - key: {{ required "adminBootstrap.tokenSecretKey names the key inside adminBootstrap.tokenSecret that holds the bootstrap token and must be set whenever adminBootstrap.tokenSecret is; see the chart's values.yaml" .Values.adminBootstrap.tokenSecretKey | quote }}
                path: token
        {{- end }}
