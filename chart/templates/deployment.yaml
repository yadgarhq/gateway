apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # LISTEN and METRICS_LISTEN are stated explicitly here, unlike
            # task/task-db's chart, where they are left to the binary's own
            # defaults because those defaults already match. gateway is the one
            # service every client address ends up at, so its ports are made
            # visible in the chart rather than left implicit in code someone
            # would have to go read.
            - name: LISTEN
              value: "0.0.0.0:8080"
            - name: METRICS_LISTEN
              value: "0.0.0.0:9090"
            - name: TASK_HOST
              value: {{ .Values.task.host | quote }}
            - name: TASK_PORT
              value: {{ .Values.task.port | quote }}
            # The whole credential lifecycle: where POST /auth/login and POST
            # /auth/enrol are sent (D75, D73), AND where attestation resolves a
            # bearer token on every tools/call (ADR-0488). The pair matches
            # TASK_HOST / TASK_PORT deliberately. There is no second variable for
            # the identity half any more — YADGAR_IAM_ADDR reserved it while it was
            # unimplemented, and is deleted. See values.yaml.
            - name: IAM_HOST
              value: {{ .Values.iam.host | quote }}
            - name: IAM_PORT
              value: {{ .Values.iam.port | quote }}
            # D74. The ADDRESS is required and gateway exits without it: a
            # gateway with nowhere to keep its buckets enforces no capacity
            # limit at all, and that is a deployment mistake rather than an
            # outage, so D69's fail-at-boot rule applies. An unreachable Valkey
            # at RUNTIME is the other case, and there the call proceeds.
            - name: YADGAR_VALKEY_ADDR
              value: {{ .Values.rateLimit.addr | quote }}
            - name: YADGAR_RATE_LIMITS
              value: {{ .Values.rateLimit.limits | quote }}
            - name: YADGAR_RATE_LIMIT_DEFAULT
              value: {{ .Values.rateLimit.default | quote }}
            - name: YADGAR_RATE_LIMIT_TIMEOUT_MS
              value: {{ .Values.rateLimit.timeoutMs | quote }}
            # The DIVISOR of the degraded-mode floor, and required for the same
            # reason the address is. While Valkey cannot answer, each replica
            # holds callers to rate/this on its own; the aggregate bound that
            # makes that acceptable holds only if this is the real ceiling. Taken
            # from the autoscaler's own maximum when it is enabled, and from the
            # fixed replica count when it is not — a constant in the binary and a
            # number here would be two places that must agree, and only one of
            # them gets edited.
            - name: YADGAR_MAX_REPLICAS
              value: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.maxReplicas | quote }}{{ else }}{{ .Values.replicaCount | quote }}{{ end }}
            # No default here (see main.rs / from_default_env): unset means
            # silent, which is the exact failure this line exists to prevent.
            - name: RUST_LOG
              value: "info"
            {{- if .Values.trustUnauthenticatedHeaders }}
            # DEVELOPMENT ONLY (see the comment on this value in values.yaml).
            # An explicit OPT-OUT: setting it trusts the identity the caller
            # attaches to its own request, verified by nothing. Absent, gateway
            # resolves the request's bearer token through iam.ResolveCredential,
            # which is the binary's default and needs no variable at all.
            - name: YADGAR_TRUST_UNAUTHENTICATED_HEADERS
              value: "1"
            {{- end }}
          # This service does NOT wait for task before listening, for the same
          # reason task does not wait for task-db: a downstream that is not yet
          # ready has no endpoint to dial, and blocking startup on it would turn
          # one module's slow boot into a cascading outage at the one place all
          # traffic already passes through. A call that cannot reach `task` fails
          # per-request, which is recoverable; refusing to start is not.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
