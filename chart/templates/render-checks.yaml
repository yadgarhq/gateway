{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE THIS CHECK READS
THEM (ledger 1135).

`{{- if .Values.autoscaling.enabled }}` BELOW, AND `templates/scaledobject.yaml`'s
own gate, are BARE TRUTHINESS TESTS, which are FAIL-OPEN on a string. Measured on
helm 3.18.4 and 4.3.0, identically:

  false, 0, null, {}, []   render no ScaledObject
  true                     renders one
  "false", "no", "true", 1 render one

So `autoscaling.enabled: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
SCALEDOBJECT. ADR-0797 is the governing rule for this arm: a values key a helm
condition reads, and that this chart DECLARES, is validated with `kindIs "bool"` ON
THE RAW VALUE, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL UP, `autoscaling` ITSELF IS READ AS A BLOCK, NOT A TOGGLE, by both this
check and `templates/scaledobject.yaml`. Measured: a values file setting
`autoscaling: "x"` crashes `templates/scaledobject.yaml` with a raw Go template
error naming no key at all, because `.enabled` cannot be read off a non-map.
ADR-0794 is the governing rule for THIS arm: shape is tested with `kindIs "map"`
ON THE RAW VALUE, `hasKey` first, for the same reason.

ADR-0850 is why BOTH templates need their own copy of this: a `fail` here aborts the
whole render, but which template's unguarded read panics first is not under this
chart's control (measured: `scaledobject.yaml` panics before this file's `fail` is
ever reached), so `templates/scaledobject.yaml` carries its own `kindIs "map"` guard
rather than relying on this one running first.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794) — a refusal and
a raise both exit 1, so the message is the only thing that tells them apart.
`scripts/tests/test_render_checks.py` holds the banned markers in one place and
reads this whole file for them; the nine-shape table beside it is the gate on this
block.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "gateway: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "gateway: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read from "
      "inside it, and a non-map here crashes the template with a raw Go error naming no key "
      "at all. Write `autoscaling:` as a block, with `enabled: true` or `enabled: false` "
      "inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "gateway: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "gateway: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "gateway.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}
