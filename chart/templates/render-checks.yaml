{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE THIS CHECK READS
THEM (ledger 1135).

`{{- if .Values.autoscaling.enabled }}` BELOW, AND `templates/scaledobject.yaml`'s
own gate, are BARE TRUTHINESS TESTS, which are FAIL-OPEN on a string. Measured on
helm 3.18.4 and 4.3.0, identically:

  false, 0, null, {}, []   render no ScaledObject
  true                     renders one
  "false", "no", "true", 1 render one

So `autoscaling.enabled: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
SCALEDOBJECT. ADR-0797 is the governing rule for this arm: a values key a helm
condition reads, and that this chart DECLARES, is validated with `kindIs "bool"` ON
THE RAW VALUE, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL UP, `autoscaling` ITSELF IS READ AS A BLOCK, NOT A TOGGLE, by both this
check and `templates/scaledobject.yaml`. Measured: a values file setting
`autoscaling: "x"` crashes `templates/scaledobject.yaml` with a raw Go template
error naming no key at all, because `.enabled` cannot be read off a non-map.
ADR-0794 is the governing rule for THIS arm: shape is tested with `kindIs "map"`
ON THE RAW VALUE, `hasKey` first, for the same reason.

ADR-0850 is why BOTH templates need their own copy of this: a `fail` here aborts the
whole render, but which template's unguarded read panics first is not under this
chart's control (measured: `scaledobject.yaml` panics before this file's `fail` is
ever reached), so `templates/scaledobject.yaml` carries its own `kindIs "map"` guard
rather than relying on this one running first.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794) — a refusal and
a raise both exit 1, so the message is the only thing that tells them apart.
`scripts/tests/test_render_checks.py` holds the banned markers in one place and
reads this whole file for them; the nine-shape table beside it is the gate on this
block.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "gateway: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "gateway: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read from "
      "inside it, and a non-map here crashes the template with a raw Go error naming no key "
      "at all. Write `autoscaling:` as a block, with `enabled: true` or `enabled: false` "
      "inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "gateway: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "gateway: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "gateway.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}
{{/*
EVERY NUMERIC KNOB THIS CHART RENDERS IS A WHOLE NUMBER, OR THE RENDER REFUSES NAMING THE
KEY (yaadgaar 482, 485).

A values FILE decodes a number as float64, and `quote` prints a float64 with `%v`, so
1000000 renders "1e+06" and 2147483648 renders "2.147483648e+09": the binary parses
neither. The rendering sites below therefore cast with `int64`. `int64` is silent on a
value that does not fit (a 20-digit string becomes 0, 1e20 becomes
-9223372036854775808) and parses a string base 0 (`0123` is 83, `08` is 0), so the cast
is never the check. Measured on helm 4.3.0. This block is the check, and it runs BEFORE
the cast: a string is at most 18 digits with no leading zero, and a number is whole and
below 1e18. A string of digits stays valid (`--set-string projectValidation.registryPollSeconds=30`
is accepted by design, ADR-0847), and so does any non-negative whole number in range.

Three bounds ride on the same loop. A port is refused below 1 (port 0 listens on
nothing) and above 65535, the largest TCP port. A replica count is refused above
2147483647, the int32 field Kubernetes stores it in. ZERO IS NOT REFUSED FOR `replicaCount`: `replicaCount` 0 stays legal while autoscaling is off (scale to zero, ruled 2026-11-03). `autoscaling.minReplicas` below 2 is refused while autoscaling is on (D55, yaadgaar 482), by the block at the end of this file.

ONLY A KNOB THE RENDER READS IS CHECKED. `replicaCount` feeds `replicas:` and
`YADGAR_MAX_REPLICAS` only while `autoscaling.enabled` is false, and `autoscaling.minReplicas`
and `maxReplicas` feed the ScaledObject and `YADGAR_MAX_REPLICAS` only while it is true,
so a bad value in the arm that is off changes nothing and is not refused.
`terminationGracePeriodSeconds` and `preStopSleepSeconds` sit behind `with`, which skips
nil and the NUMBER 0, and so are checked only when present. `with` PASSES THE STRING "0":
every non-empty string is true to a Go template, so `--set-string terminationGracePeriodSeconds=0`
used to render `terminationGracePeriodSeconds: 0`, an immediate SIGKILL. For these two keys a
string whose `int64` is 0 is therefore refused by name, after the whole-number check (yaadgaar
639). It is the one carve-out from ADR-0847. Today the regex admits exactly one such string,
"0" ("00", " 0", "0.0" and "-0" are refused as not whole); comparing `int64` and not the
exact string keeps "00" refused if the regex is ever loosened. The number 0 is not refused.
The grace period, the sleep and `topologySpread.maxSkew` are cast like the rest (yaadgaar 550):
`hooks/chart_baseline.py` reads `{{ . | int64 }}` since yadgarhq/actions v1.64.0. All three stay
bounded at 999999, the largest value a float64 prints without an exponent. The gate no longer
forces that bound, and lifting it is a separate decision.
`topologySpread.maxSkew` is checked, bounded the same way and refused below 1 because the API requires it greater than zero, only while `topologySpread.enabled` is true, because only
then is it rendered. The other knobs are rendered unconditionally, so a missing key reads as
nil here and is refused too.
`autoscaling.enabled` is a confirmed bool by the blocks above.
*/}}
{{- $checks := list
      (dict "key" "task.port" "value" .Values.task.port "min" 1 "max" 65535)
      (dict "key" "iam.port" "value" .Values.iam.port "min" 1 "max" 65535)
      (dict "key" "project.port" "value" .Values.project.port "min" 1 "max" 65535)
      (dict "key" "service.port" "value" .Values.service.port "min" 1 "max" 65535)
      (dict "key" "projectValidation.registryPollSeconds" "value" .Values.projectValidation.registryPollSeconds)
      (dict "key" "credentialCache.ttlSeconds" "value" .Values.credentialCache.ttlSeconds)
      (dict "key" "rateLimit.timeoutMs" "value" .Values.rateLimit.timeoutMs) }}
{{- if .Values.autoscaling.enabled }}
{{- $checks = append $checks (dict "key" "autoscaling.minReplicas" "value" .Values.autoscaling.minReplicas "max" 2147483647) }}
{{- $checks = append $checks (dict "key" "autoscaling.maxReplicas" "value" .Values.autoscaling.maxReplicas "max" 2147483647) }}
{{- else }}
{{- $checks = append $checks (dict "key" "replicaCount" "value" .Values.replicaCount "max" 2147483647) }}
{{- end }}
{{- if and (hasKey .Values "terminationGracePeriodSeconds") (not (kindIs "invalid" .Values.terminationGracePeriodSeconds)) }}
{{- $checks = append $checks (dict "key" "terminationGracePeriodSeconds" "value" .Values.terminationGracePeriodSeconds "max" 999999 "refuseZeroString" true) }}
{{- end }}
{{- if and (hasKey .Values "preStopSleepSeconds") (not (kindIs "invalid" .Values.preStopSleepSeconds)) }}
{{- $checks = append $checks (dict "key" "preStopSleepSeconds" "value" .Values.preStopSleepSeconds "max" 999999 "refuseZeroString" true) }}
{{- end }}
{{- if and (kindIs "map" .Values.topologySpread) .Values.topologySpread.enabled }}
{{- $checks = append $checks (dict "key" "topologySpread.maxSkew" "value" .Values.topologySpread.maxSkew "min" 1 "max" 999999) }}
{{- end }}
{{- range $check := $checks }}
{{- $value := $check.value }}
{{- $whole := false }}
{{- if kindIs "string" $value }}
{{- $whole = regexMatch "^(0|[1-9][0-9]{0,17})$" $value }}
{{- else if or (kindIs "float64" $value) (kindIs "int64" $value) (kindIs "int" $value) }}
{{- $whole = and (ge (float64 $value) 0.0) (lt (float64 $value) 1.0e18) (eq (float64 $value) (floor (float64 $value))) }}
{{- end }}
{{- if not $whole }}
{{- fail (printf "gateway: `%s` must be a whole number of at least 0 and is %s. It is rendered through `int64`, which turns a fraction, an out-of-range value or a string with a leading zero into a different number without saying so. Write digits only, for example `30`." $check.key (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "refuseZeroString") (kindIs "string" $value) (eq (int64 $value) 0) }}
{{- fail (printf "gateway: `%s` is the string %s, which a `with` guard treats as set, so it would render as 0 and not as the API default. Write the number 0 (`--set`, not `--set-string`) or delete the key to leave the field unset (yaadgaar 639)." $check.key (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "min") (lt (int64 $value) (int64 $check.min)) }}
{{- fail (printf "gateway: `%s` must be at least %d and is %s." $check.key (int64 $check.min) (toJson $value)) }}
{{- end }}
{{- if and (hasKey $check "max") (gt (int64 $value) (int64 $check.max)) }}
{{- fail (printf "gateway: `%s` must be at most %d and is %s." $check.key (int64 $check.max) (toJson $value)) }}
{{- end }}
{{- end }}

{{/*
`sourceAddress.trustedProxyHops` (yaadgaar 513). The binary accepts the empty string (no
trust boundary declared) or a count of 0..16 and exits at boot on anything else
(`TrustBoundary::parse`: NotANumber, TooDeep), so a bad value used to pass the render and
crash-loop the pod. `values.schema.json` types it (null, an integer 0..16 or a string)
and bounds a number; THIS block reads a string, which a schema pattern would also reject
but without naming the key the way the other checks here do. A string is the empty
string or a canonical count 0..16: no sign, no space, no leading zero, no fraction.
`TrustBoundary::parse` (src/source.rs) trims, then calls `u32::parse`, so the binary reads
"01", " 1" and "+1" as 1 and a whitespace-only string as Undeclared. This chart refuses all
of those, a deliberate fail-closed choice on a knob that gates source-address attribution;
the estate uses only the empty string. A null makes helm
delete the key, which is the documented empty instruction and renders a bare `value:`.
*/}}
{{- if and (kindIs "map" .Values.sourceAddress) (hasKey .Values.sourceAddress "trustedProxyHops") }}
{{- $hops := .Values.sourceAddress.trustedProxyHops }}
{{- if and (kindIs "string" $hops) (not (regexMatch "^(|0|[1-9]|1[0-6])$" $hops)) }}
{{- fail (printf "gateway: `sourceAddress.trustedProxyHops` must be empty or a count from 0 to 16 and is %s. The gateway refuses to start on anything else, so a bad value here would only crash-loop the pod. Write the number of trusted proxies, for example `1`, or leave it empty." (toJson $hops)) }}
{{- end }}
{{- end }}
{{- /*
AUTOSCALING FLOOR, D55 (yaadgaar 482, ruled 2026-11-03). `autoscaling.minReplicas` feeds KEDA's
`minReplicaCount`, and D55 makes at least two pods a correctness property, not a tuning choice.
Refused below 2 while `autoscaling.enabled` is true. Placed after the whole-number check above, so
`int64` reads a confirmed whole number; `autoscaling.enabled` is a confirmed bool by the shape blocks.
While autoscaling is off the knob is not read, and `replicaCount: 0` stays legal (scale to zero).
*/}}
{{- if .Values.autoscaling.enabled }}
{{- if lt (int64 .Values.autoscaling.minReplicas) 2 }}
{{- fail (printf (join "" (list
      "gateway: `autoscaling.minReplicas` must be at least 2 while `autoscaling.enabled` is true, and is %s. "
      "It renders as the ScaledObject's `minReplicaCount`, and below 2 the service can run on one pod or "
      "none, which D55 forbids. Write 2 or more, or set `autoscaling.enabled: false`."))
      (toJson .Values.autoscaling.minReplicas)) }}
{{- end }}
{{- end }}
